prompt_package_id: product_hardlight_minimal_shadow_v1
version: v1
language: en
mode: text_to_image
reference_policy: text_only_no_image_input

title_cn: "硬光极简阴影构图产品图"
purpose_cn: "生成硬光几何阴影下的极简产品静物图"
scene_type: hardlight_minimal_studio
product_category: leather_goods
aspect_ratio: "4:5"
style_direction: "minimal hard-light studio product photography"

prompt: |
  Minimal studio product photography with strong hard light. A beige leather wallet placed on a smooth warm gray surface, casting a long geometric shadow. One tennis ball or simple round prop nearby for contrast. Clean composition, strong editorial mood, precise shadows, premium material texture, modern commercial still-life, vertical 4:5.

negative_prompt: |
  people, hands, faces, readable brand logos, fake text, watermark, clutter, distorted objects, warped geometry, extra products, cyberpunk style, cartoon style, CGI plastic look, low resolution, overexposed highlights, messy background

acceptance_gate:
  prompt_subject_match: true
  style_direction_match: true
  no_person_or_face_unless_expected: true
  no_readable_text_or_logo_unless_expected: true
  commercial_usability: true

memory_write_allowed: false
daily_note_write_allowed: false
