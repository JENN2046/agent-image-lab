prompt_package_id: product_skincare_stone_bathroom_v1
version: v1
language: en
mode: text_to_image
reference_policy: text_only_no_image_input

title_cn: "浴室石材台面护肤品静物图"
purpose_cn: "生成高级护肤品与浴室石材台面静物图"
scene_type: skincare_bathroom_counter
product_category: skincare
aspect_ratio: "4:5"
style_direction: "premium skincare still-life photography"

prompt: |
  Premium skincare still-life on a light stone bathroom counter. Frosted glass bottle, cream jar, folded white towel, and small beige pouch arranged near soft morning window light. Clean spa atmosphere, water-like highlights, subtle reflections, quiet luxury, realistic glass and stone texture. Minimal, fresh, editorial commercial photography, vertical 4:5.

negative_prompt: |
  people, hands, faces, readable brand logos, fake text, watermark, clutter, distorted objects, warped geometry, extra products, cyberpunk style, cartoon style, CGI plastic look, low resolution, overexposed highlights, messy background

acceptance_gate:
  prompt_subject_match: true
  style_direction_match: true
  no_person_or_face_unless_expected: true
  no_readable_text_or_logo_unless_expected: true
  commercial_usability: true

memory_write_allowed: false
daily_note_write_allowed: false
