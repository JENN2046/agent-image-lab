prompt_package_id: product_macro_editorial_detail_v1
version: v1
language: en
mode: text_to_image
reference_policy: text_only_no_image_input

title_cn: "杂志风皮革微距特写图"
purpose_cn: "生成皮具细节、缝线和皮革纹理特写图"
scene_type: editorial_macro_detail
product_category: leather_goods
aspect_ratio: "4:5"
style_direction: "editorial macro product photography"

prompt: |
  Editorial macro product photography of a beige leather wallet detail. Close-up crop showing stitching, folded edge, leather grain, and subtle shadow. Premium magazine style, shallow depth of field, warm natural light, tactile material realism. Minimal background, elegant composition, no text, no logo, vertical 4:5.

negative_prompt: |
  people, hands, faces, readable brand logos, fake text, watermark, clutter, distorted objects, warped geometry, extra products, cyberpunk style, cartoon style, CGI plastic look, low resolution, overexposed highlights, messy background

acceptance_gate:
  prompt_subject_match: true
  style_direction_match: true
  no_person_or_face_unless_expected: true
  no_readable_text_or_logo_unless_expected: true
  commercial_usability: true

memory_write_allowed: false
daily_note_write_allowed: false
