prompt_package_id: product_camping_outdoor_canvas_v1
version: v1
language: en
mode: text_to_image
reference_policy: text_only_no_image_input

title_cn: "露营野餐装备静物图"
purpose_cn: "生成帆布野餐布上的户外露营装备静物图"
scene_type: camping_picnic_still_life
product_category: outdoor_gear
aspect_ratio: "4:5"
style_direction: "outdoor camping still-life product photography"

prompt: |
  Outdoor camping still-life product photography. A beige utility wallet, enamel cup, folded olive fabric, compact flashlight, and small trail snack arranged on a canvas picnic cloth. Natural forest sunlight filtering through leaves, soft dappled shadows, earthy tones, premium outdoor gear campaign mood. Realistic materials, vertical 4:5.

negative_prompt: |
  people, hands, faces, readable brand logos, fake text, watermark, clutter, distorted objects, warped geometry, extra products, cyberpunk style, cartoon style, CGI plastic look, low resolution, overexposed highlights, messy background

acceptance_gate:
  prompt_subject_match: true
  style_direction_match: true
  no_person_or_face_unless_expected: true
  no_readable_text_or_logo_unless_expected: true
  commercial_usability: true

memory_write_allowed: false
daily_note_write_allowed: false
