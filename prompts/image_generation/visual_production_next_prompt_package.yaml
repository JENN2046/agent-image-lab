visual_constraints:
  shot_goal: commercial still-life hero image
  aspect_ratio: "1:1"
  product_dominance: high
  negative_space: controlled and headline-safe
  mood: low-key premium dark tech
  style: realistic commercial product photography
  review_required: true

positive_prompt_draft: |
  Create a square premium dark tech product still life with the subject dominating the frame. The image should feel like a premium commercial product photograph, not a casual snapshot or decorative scene.

  Keep the object fully visible and centered as the hero. Use dark premium materials with believable metal and glass behavior, controlled reflections, and low-key lighting that keeps the silhouette strong. The product should read as high-end, modern, and technically refined. Preserve a calm, commercial composition with enough negative space for later headline placement.

  The lighting should be restrained and elegant, with readable highlights and shadows that support the product form without making the scene feel theatrical. Keep the environment quiet, premium, and uncluttered. The result should feel suitable for a high-end product campaign and should avoid anything that makes the object look generic, cheap, or over-styled.

negative_prompt_draft: |
  readable text, generated text, random letters, logo, fake brand, watermark, signature, label, QR code,
  people, hands, faces, human body,
  extra products, duplicated object, cropped object, product too small, product hidden by props,
  flashlight, speaker, bottle, desk lamp, humidifier, thermos, candle, lantern, vintage lamp,
  broken geometry, warped body, melted shape, floating parts, impossible connections,
  cheap plastic look, glossy toy-like finish, fake metal, fake glass, muddy surface, dirty reflections,
  noisy background, clutter, distracting props, busy scenery, overexposed highlights, flat lighting,
  illustration, cartoon, CGI look, low resolution, over-sharpened, visible AI artifact

