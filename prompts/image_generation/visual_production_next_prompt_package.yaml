visual_constraints:
  shot_goal: product-first square hero image
  aspect_ratio: "1:1"
  product_dominance: high
  negative_space: controlled and headline-safe
  mood: premium blue-hour outdoor lifestyle
  style: realistic commercial product photography
  review_required: true

positive_prompt_draft: |
  Create a square premium outdoor lifestyle hero image of a modern portable LED camping lantern. The lantern must be the clear hero product and should read immediately as a premium rechargeable outdoor light, not as a flashlight, speaker, bottle, desk lamp, humidifier, thermos, candle, or vintage lantern.

  Keep the product fully visible and dominant in the frame. Use a dark premium metal shell with refined industrial seams, a clean frosted diffuser with believable internal scattering, a smaller integrated lower-body control, and a thin compact base. The handle should be clean, attached, and physically plausible. Make the lantern slightly larger and more commanding than the previous hero plan, while still leaving controlled negative space around it.

  Place the product on a shallow, straight, dark horizontal table or stone surface. Use a deep blue-hour atmosphere with a warm amber glow from the diffuser and cool ambient rim light on the metal edges. The glow should be believable and softly diffused, not blown out and not magical. The image should feel like premium commercial photography with strong product readability, premium materials, and clean advertising usability.

  Keep the background quiet, blurred, and supportive only. The scene should suggest an elegant outdoor evening setting without clutter, extra products, hands, people, logos, labels, fake text, or watermark. Preserve a square composition with a strong subject-first silhouette, readable material detail, and enough calm negative space for later headline placement.

negative_prompt_draft: |
  readable text, generated text, random letters, logo, fake brand, watermark, signature, label, QR code,
  people, hands, faces, human body,
  extra lanterns, duplicated product, cropped product, product too small, product hidden by props,
  flashlight, speaker, bottle, desk lamp, humidifier, thermos, candle, vintage lantern,
  broken handle, detached handle, floating handle, impossible geometry, warped body, melted shape, unstable base,
  oversized knob, attached-looking knob, control on top cap, control on upper ring, missing lower-body control,
  thick chunky base, heavy stacked base, oversized base,
  flat plastic diffuser, cheap gray shell, dusty gray material, chalky surface, smooth plastic look,
  blown-out glow, unrealistic beams, magical aura, noisy reflections, poor contact shadow,
  cluttered campsite, busy background, fire touching the product, bright competing light,
  CGI look, illustration, cartoon, low resolution, over-sharpened, muddy material, visible AI artifact

