prompt_package_id: product_jewelry_dark_velvet_v1
version: v1
language: en
mode: text_to_image
reference_policy: text_only_no_image_input

title_cn: "首饰丝绒黑金高级静物图"
purpose_cn: "生成暗色丝绒上的首饰与皮具高级静物图"
scene_type: dark_velvet_jewelry
product_category: jewelry
aspect_ratio: "4:5"
style_direction: "premium jewelry still-life photography"

prompt: |
  Premium jewelry still-life on dark velvet. A small gold bracelet, beige leather card holder, and black satin ribbon arranged with elegant spacing. Low-key studio lighting, soft gold highlights, rich black background, luxury editorial mood. Realistic metal shine, velvet texture, refined shadows, vertical 4:5.

negative_prompt: |
  people, hands, faces, readable brand logos, fake text, watermark, clutter, distorted objects, warped geometry, extra products, cyberpunk style, cartoon style, CGI plastic look, low resolution, overexposed highlights, messy background

acceptance_gate:
  prompt_subject_match: true
  style_direction_match: true
  no_person_or_face_unless_expected: true
  no_readable_text_or_logo_unless_expected: true
  commercial_usability: true

memory_write_allowed: false
daily_note_write_allowed: false
