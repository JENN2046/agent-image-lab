prompt: |
  Realistic commercial product photography of a single premium portable LED camping lantern as the hero product. The lantern is compact and premium, with a matte graphite or dark anodized metal body, a warm translucent or frosted diffuser, a sturdy continuous handle loop, and a stable non-slip base. The product reads clearly as a rechargeable outdoor LED camping lantern, not a flashlight, candle, speaker, humidifier, thermos, desk lamp, or smart speaker.

  Compose the lantern as a single hero product on a restrained outdoor tabletop, stone, or weathered wood surface at dusk. Use soft outdoor depth in the background without turning the scene into a busy camping advertisement. The lantern should occupy about 55-70% of the visual importance, full product visible, straight-on or slight three-quarter front camera angle at product height, clean silhouette, attached handle, readable diffuser, clear body and base hierarchy.

  Use dusk ambient light mixed with controlled warm practical LED glow from the diffuser. The warm glow should feel inviting and premium while preserving product edges, diffuser texture, handle geometry, and base contact shadow. Quiet premium outdoor lifestyle mood, commercially usable hero image direction, no brand text, no fake logo, no people, no hands, no open flame, no smoke, no unsafe wet electronics, no extra lanterns, no watermark, no cyberpunk or gaming look.

