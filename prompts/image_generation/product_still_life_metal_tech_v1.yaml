prompt_package_id: product_still_life_metal_tech_v1
version: v1
language: en
mode: text_to_image
reference_policy: text_only_no_image_input

title_cn: "金属科技小物静物图"
purpose_cn: "生成金属卡包与科技小物的极简商业静物图"
scene_type: minimal_tech_still_life
product_category: tech_accessory
aspect_ratio: "4:5"
style_direction: "minimal high-end tech accessory still-life"

prompt: |
  Minimal high-end tech accessory still-life. A brushed metal card holder, wireless earbuds case, black charging cable loop, and matte graphite notebook arranged on a cool gray surface. Crisp softbox lighting, subtle reflections, refined industrial mood, precise spacing, premium modern product photography. Cool neutral palette, realistic metal texture, vertical 4:5.

negative_prompt: |
  people, hands, faces, readable brand logos, fake text, watermark, clutter, distorted objects, warped geometry, extra products, cyberpunk style, cartoon style, CGI plastic look, low resolution, overexposed highlights, messy background

acceptance_gate:
  prompt_subject_match: true
  style_direction_match: true
  no_person_or_face_unless_expected: true
  no_readable_text_or_logo_unless_expected: true
  commercial_usability: true

memory_write_allowed: false
daily_note_write_allowed: false
