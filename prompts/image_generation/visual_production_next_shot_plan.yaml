shots:
  - shot_id: visual_production_next_shot_dark_tech_hero_01
    shot_role: hero_product_shot
    visual_goal: premium square hero image with the dark tech product as the dominant subject
    subject: premium dark tech product still life
    composition_notes:
      - keep the product fully visible
      - make the product large and dominant in the frame
      - keep the silhouette clean and commercial
      - preserve controlled negative space around the subject
    lighting_notes:
      - use low-key premium lighting
      - preserve controlled highlights on metal and glass
      - keep reflections believable and not distracting
    material_realism_requirements:
      - premium metal should read as finished and believable
      - glass should read as physically present and not synthetic
      - surfaces should support a dark premium tech identity
    commercial_usability_requirements:
      - product must read clearly on first glance
      - keep the frame headline-safe
      - avoid text, logos, clutter, and competing objects
    failure_risks:
      - subject drift
      - material_fake_or_plastic
      - lighting_inconsistent
      - composition_unusable
      - commercial_unfit
      - background_noise
      - detail_distortion
      - text_logo_or_brand_risk
      - ai_artifact_visible
    review_rubric_refs:
      - docs/VISUAL_EVAL_RUBRIC.md
      - docs/VISUAL_FAILURE_TAXONOMY.md
    generation_allowed_now: false

  - shot_id: visual_production_next_shot_dark_tech_material_detail_01
    shot_role: material_detail_supporting_shot
    visual_goal: supporting detail shot that validates metal, glass, reflection, and surface quality
    subject: premium dark tech product still life
    composition_notes:
      - tighter crop than the hero shot
      - keep the key surfaces and edges readable
      - avoid abstract macro distortion that hides product identity
    lighting_notes:
      - preserve controlled specular highlights
      - keep shadow structure coherent
      - avoid noisy or overactive reflections
    material_realism_requirements:
      - metal edges should feel manufactured
      - glass should remain plausible and clean
      - surface finish should support dark premium styling
    commercial_usability_requirements:
      - useful as evidence, not a replacement for the hero shot
      - keep the same route identity visible
    failure_risks:
      - detail distortion
      - material_fake_or_plastic
      - lighting_inconsistent
      - ai_artifact_visible
    review_rubric_refs:
      - docs/VISUAL_EVAL_RUBRIC.md
      - docs/VISUAL_FAILURE_TAXONOMY.md
