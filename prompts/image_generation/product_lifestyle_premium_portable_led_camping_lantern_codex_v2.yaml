prompt: |
  Create a realistic premium commercial square hero product image of a single modern rechargeable portable LED camping lantern. The image must be a fixed 1:1 square ecommerce main image. Keep the strongest parts of the v14.161 candidate: large centered product presence, premium black metal shell, warm frosted diffuser glow, rich blue-hour atmosphere, dark horizontal table, and realistic commercial photography. Now correct the main weakness: it must clearly read as a premium portable LED camping lantern for outdoor use, not an indoor desk lamp, office lamp, bedside lamp, speaker, humidifier, thermos, flashlight, candle, vintage kerosene lantern, or square box lantern.

  The lantern is the unmistakable first visual focus, centered and large, with full handle, diffuser, body, lower-body control, and compact base visible. Build a premium outdoor electronics product: black graphite anodized aluminum or blackened metal cylindrical body, crisp machined rings, refined bevels, durable satin finish, subtle rechargeable product detail, integrated dark metal carry handle with believable side hinges, large clean frosted warm cylindrical diffuser with fine even micro-texture and amber internal scattering, small lower-body precision dimmer button or knurled knob below the diffuser and above the base, and a thin compact stable dark metal base. The shell must look premium and metallic, not gray plastic or toy plastic. The diffuser must be luminous but readable, not blown out, dirty, coarse, spotty, or smooth cheap plastic.

  Set the scene outdoors at the perfect early blue hour shortly after sunset: saturated clean deep blue sky or shaded outdoor background, low cool ambient light, and warm amber lantern glow. The background is a second visual layer only: soft dark tree line, faint campsite deck, subtle tent silhouette, or quiet outdoor camp table atmosphere, blurred and darker than the product. It should support the camping-lantern identity without becoming scenic landscape. No bright background lamp dot, no competing light, no indoor shelf, no office desk, no bright window, no daylight, no orange sunset, no black night.

  Design a clear upper-middle-lower composition. Upper layer: controlled rich deep blue outdoor background close around the handle with limited empty space. Middle layer: the large centered premium LED camping lantern as the strongest visual layer. Lower layer: very shallow deep charcoal camp table, dark walnut outdoor table, or blackened wood deck, front edge perfectly horizontal and parallel to the bottom frame, darker than the product and sky, low texture, non-glossy, secondary. Do not use a diagonal table, side-placed table, large foreground band, medium brown tabletop, orange tabletop, bright tabletop, or strong reflection.

  Use a straight-on or very slight three-quarter front camera angle at product height, sharp product focus, softly blurred background, premium high contrast, richer saturation than v14.161, deeper blacks, clean black metal highlights, strong warm amber versus deep blue separation, and realistic product photography. No people, no hands, no open flame, no fire, no smoke, no extra lanterns, no packaging, no readable text, no fake logo, no random letters, no watermark, no CGI, no illustration, no cartoon, no cyberpunk, no gaming look.

