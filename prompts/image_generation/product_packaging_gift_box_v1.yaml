prompt_package_id: product_packaging_gift_box_v1
version: v1
language: en
mode: text_to_image
reference_policy: text_only_no_image_input

title_cn: "高级礼盒包装静物图"
purpose_cn: "生成皮具礼盒与丝带包装商业静物图"
scene_type: premium_gift_packaging
product_category: gift_packaging
aspect_ratio: "4:5"
style_direction: "premium gift packaging still-life photography"

prompt: |
  Premium gift packaging still-life. A beige leather wallet rests beside an opened matte ivory gift box, tissue paper, silk ribbon, and a small envelope on a warm neutral surface. Soft studio lighting, elegant shadows, luxury gifting mood, refined composition, tactile paper and leather texture. Clean background, no readable text, vertical 4:5.

negative_prompt: |
  people, hands, faces, readable brand logos, fake text, watermark, clutter, distorted objects, warped geometry, extra products, cyberpunk style, cartoon style, CGI plastic look, low resolution, overexposed highlights, messy background

acceptance_gate:
  prompt_subject_match: true
  style_direction_match: true
  no_person_or_face_unless_expected: true
  no_readable_text_or_logo_unless_expected: true
  commercial_usability: true

memory_write_allowed: false
daily_note_write_allowed: false
