prompt_package_id: product_lifestyle_soft_cream_v1
version: v1
language: en
mode: text_to_image
reference_policy: text_only_no_image_input

title_cn: "奶油风生活方式小物图"
purpose_cn: "生成柔和奶油风皮具与生活小物图"
scene_type: soft_cream_lifestyle
product_category: small_accessory
aspect_ratio: "4:5"
style_direction: "soft cream lifestyle product photography"

prompt: |
  Soft cream lifestyle product photography. A beige wallet, ivory ceramic tray, folded linen fabric, and a small dried flower branch arranged on a cream tabletop. Soft diffused daylight, warm highlights, gentle shadows, clean feminine premium mood. Realistic materials, calm composition, subtle negative space, modern editorial style, vertical 4:5.

negative_prompt: |
  people, hands, faces, readable brand logos, fake text, watermark, clutter, distorted objects, warped geometry, extra products, cyberpunk style, cartoon style, CGI plastic look, low resolution, overexposed highlights, messy background

acceptance_gate:
  prompt_subject_match: true
  style_direction_match: true
  no_person_or_face_unless_expected: true
  no_readable_text_or_logo_unless_expected: true
  commercial_usability: true

memory_write_allowed: false
daily_note_write_allowed: false
