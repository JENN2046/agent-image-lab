prompt_package_id: product_resort_coastal_accessory_v1
version: v1
language: en
mode: text_to_image
reference_policy: text_only_no_image_input

title_cn: "海边度假小物静物图"
purpose_cn: "生成度假氛围的皮具、草帽和墨镜静物图"
scene_type: coastal_resort_lifestyle
product_category: travel_accessory
aspect_ratio: "4:5"
style_direction: "premium resort lifestyle product photography"

prompt: |
  Premium resort lifestyle product still-life. A light beige wallet, woven straw hat, sunglasses, and small linen pouch placed on pale stone near beach-like sunlight. Soft coastal color palette, warm highlights, gentle breeze feeling, elegant vacation mood. Realistic fabric and leather textures, clean negative space, vertical 4:5.

negative_prompt: |
  people, hands, faces, readable brand logos, fake text, watermark, clutter, distorted objects, warped geometry, extra products, cyberpunk style, cartoon style, CGI plastic look, low resolution, overexposed highlights, messy background

acceptance_gate:
  prompt_subject_match: true
  style_direction_match: true
  no_person_or_face_unless_expected: true
  no_readable_text_or_logo_unless_expected: true
  commercial_usability: true

memory_write_allowed: false
daily_note_write_allowed: false
