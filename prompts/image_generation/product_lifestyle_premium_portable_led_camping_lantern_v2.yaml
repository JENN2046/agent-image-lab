prompt: |
  Realistic commercial product photography of a single premium rechargeable portable LED camping lantern as the hero product for an outdoor lifestyle main image. The product must be the first visual focus and should feel valuable, well-designed, and worth buying. The lantern has a matte graphite or dark anodized metal body, a warm frosted diffuser with readable edges, a sturdy continuous attached carry handle, a small refined dimmer knob or side control, and a stable non-slip base. It must clearly read as a premium portable LED camping lantern, not a flashlight, candle, speaker, humidifier, thermos, desk lamp, or smart speaker.

  Set the scene at early blue hour shortly after sunset: the sky is a clean refined deep blue, not bright daytime, not orange sunset, and not black night. There is enough cool ambient light to preserve the product silhouette, material detail, handle geometry, diffuser edge, control detail, and base shape. The lantern emits controlled warm LED light that becomes the visual attraction without overexposing or blowing out the frosted diffuser.

  Design a clear three-layer hero composition. The upper layer has clean blue-hour sky with softly blurred campsite silhouettes, tree shapes, or a distant warm campsite light as secondary support. The middle layer is dominated by the lantern, sharp and complete, with full handle, diffuser, dimmer knob, body, and base visible. The lower layer is darker and more grounded than the upper sky and middle product area: a deep-toned weathered wood, dark stone, or restrained campsite tabletop with subtle texture, contact shadow, and a soft warm reflection from the lantern. The background must serve the product as the second visual layer and must not steal attention.

  Use a straight-on or slight three-quarter front camera angle at product height, realistic product photography depth of field, balanced negative space, premium outdoor electronics finish, clean silhouette, believable contact shadow, and refined warm-versus-cool color contrast. No brand text, no fake logo, no people, no hands, no open flame, no smoke, no extra lanterns, no watermark, no cyberpunk look, no toy plastic, no bright busy foreground, and no overexposed glow.

