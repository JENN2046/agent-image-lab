revision_goals_cn:
  - "禁止左上角彩色杂点、随机彩色像素和彩色噪点。"
  - "让杯口边缘更干净、更连续、更精细。"
  - "让把手连接处更清晰，避免轻微软糊。"
  - "保持暖灰高级背景，但降低明显背景横线。"
  - "让软阴影更干净，增强落地感和高级感。"
  - "稍微加强轮廓光和边缘定义，不破坏柔和商业主图风格。"
  - "保持产品占比 65-75%，避免重新变小。"
  - "保持无 logo、无文字、无人物、无道具干扰。"

composition_controls:
  product_scale_target: "mug occupies roughly 65-75 percent of image height"
  framing: "centered three-quarter hero angle, full product visible, no crop"
  top_margin: "balanced top negative space, not excessive"
  subject_count: "single mug only"
  direction_change_allowed: false

lighting_controls:
  key_light: "premium soft directional key light from upper left"
  fill_light: "gentle fill preserving visible ceramic form"
  rim_light: "subtle but clearer rim light defining the mug edge"
  shadow: "clean refined soft contact shadow, premium and natural"
  avoid: "flat lighting, harsh reflections, hard shadow edges, overexposed highlights"

background_controls:
  backdrop: "premium warm-gray layered studio backdrop"
  depth: "smooth depth gradient with clean tabletop separation"
  horizon_line: "no obvious horizontal background line or stripe"
  clutter: "no props, no patterns, no extra objects"

material_texture_controls:
  ceramic_finish: "warm-white matte ceramic, low-sheen, fine tactile texture"
  rim: "smooth thin clean continuous rim edge, not rough or jagged"
  handle: "simple curved handle with crisp clean attachment points"
  geometry: "accurate mug geometry and natural proportions"

defect_controls:
  no_top_left_colored_speck: true
  no_random_colored_pixel: true
  no_color_noise: true
  no_colored_specks: true
  no_dust_spots: true
  no_blurry_handle_attachment: true
  no_rough_rim_edge: true
  no_visible_background_horizontal_line: true
  no_small_product_in_frame: true

prompt: |
  Premium clean commercial product photo of a synthetic warm-white matte ceramic coffee mug as the only product subject. Large centered hero mug occupying about 70 percent of the frame height, full product visible, balanced margins, controlled top negative space, three-quarter hero angle. Smooth thin clean continuous cup rim, crisp handle attachment points, accurate mug geometry and natural proportions. Refined low-sheen ceramic surface with fine tactile matte texture. Premium soft directional studio key light from upper left, gentle fill light, subtle clear rim light defining the mug edge, clean refined soft contact shadow, visible ceramic form and depth. Premium warm-gray layered studio backdrop with smooth depth gradient and clean tabletop separation, no obvious horizon line, no props, no text, no logo, no people, catalog-ready ecommerce main image, elevated quiet premium presentation, vertical 4:5.

negative_prompt: |
  people, hands, faces, readable text, brand logo, watermark, props, extra objects, extra products, duplicate mugs, small product in frame, excessive top whitespace, unbalanced margins, malformed handle, blurry handle attachment, blurry handle joint, broken rim, rough rim edge, jagged rim, thick uneven rim, warped geometry, unrealistic ceramic texture, excessive gloss, CGI plastic look, flat lighting, weak background separation, harsh reflections, hard shadow, dirty shadow, overexposed highlights, underexposed product, obvious horizontal background line, background stripe, banding, top-left colored speck, random colored pixel, colored specks, color noise, random marks, dust spots, noisy image, cyberpunk style, gaming HUD, cartoon style, low resolution

acceptance_gate:
  prompt_subject_match: true
  style_direction_match: true
  no_person_or_face_unless_expected: true
  no_hands: true
  no_readable_text_or_logo_unless_expected: true
  single_product_subject: true
  plausible_product_geometry: true
  commercial_usability: true
  product_scale_65_to_75_percent_height: true
  controlled_top_margin: true
  lighting_depth_visible: true
  clean_background_depth: true
  no_obvious_background_horizontal_line: true
  crisp_rim_edge: true
  crisp_handle_attachment: true
  no_top_left_colored_speck: true
  no_colored_specks_or_random_marks: true
  premium_main_image_feel: true

next_trial_authorization_required: true
