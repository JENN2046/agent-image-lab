prompt: |
  Realistic premium commercial product photography of a single modern rechargeable portable LED camping lantern as the hero product for an outdoor lifestyle main image. Keep the strong product-first direction from the previous attempt, but make the product feel more premium and more deliberately engineered. The lantern is large, close, sharp, and complete. It has a matte graphite or dark anodized metal body with crisp machined edges and subtle bevels, a warm frosted diffuser with visible material thickness and a soft readable amber gradient, an integrated continuous carry handle with plausible side mounts, a side-mounted precision dimmer knob, subtle rechargeable outdoor electronics character, and a compact stable non-slip base. It must clearly read as a modern premium LED camping lantern, not a flashlight, candle, speaker, humidifier, thermos, desk lamp, smart speaker, or vintage kerosene lantern.

  Set the scene at early blue hour shortly after sunset: the sky is a clean refined blue, not bright daytime, not orange sunset, and not black night. There is enough cool ambient light to preserve the dark metal edges, handle shape, product silhouette, side dimmer, diffuser edge, and base shape. The lantern emits controlled warm LED light that draws the eye, but the diffuser must not be overexposed. The diffuser center should be warm amber and softly luminous, not pure white, not clipped, and not blown out; frosted surface texture, side thickness, and edge gradient must remain readable.

  Design a controlled product-first three-layer hero composition. The upper layer is calm clean blue-hour sky around the handle. The middle layer is dominated by the sharp premium lantern, visually strongest, with full handle, diffuser, side dimmer, body bevels, and base visible. The lower layer is a shallow dark charcoal wood or dark stone surface occupying less than 20 percent of the frame height, darker than the product and sky, with low texture, muted contact shadow, and almost no warm reflection. The background is only distant dark blurred blue-hour atmosphere, such as a soft tree line or faint campsite silhouette. Do not include a visible bright background light dot, camp light, lake, mountain, tent, tree, or tabletop element that competes with the lantern.

  Use a straight-on or slight three-quarter front camera angle at product height, shallow realistic product photography depth of field, clean negative space around the handle, premium outdoor electronics finish, crisp silhouette, subtle grounding shadow, and refined warm-versus-cool contrast. The product should feel like the main sales image, not a detail image and not a scenic camping landscape. No brand text, no fake logo, no people, no hands, no open flame, no smoke, no extra lanterns, no watermark, no cyberpunk look, no toy plastic, no bright or busy foreground, no strong foreground reflection, and no overexposed glow.

