  Set the scene at early blue hour shortly after sunset. The sky and background are dark, saturated, and rich deep blue, not pale blue, not washed out, not bright daytime, not orange sunset, and not black night. The background should be a quiet dark blue outdoor atmosphere with a distant soft tree line or faint campsite silhouette only, darker and lower behind the product. There must be no visible bright background light dot and no camp light competing with the lantern. The lantern emits warm controlled LED glow; the diffuser should look clean, premium, frosted, translucent, and luminous with rich amber warmth. Improve the v9 diffuser material: it must show frosted micro-grain and internal scattering, not a smooth plastic tube, not flat, not dirty, not spotty, not stained, not mottled, not cloudy cheap plastic, not underexposed, and not clipped white.

  Design a tighter product-first square three-layer hero composition. The upper layer is saturated deep blue-hour sky close around the handle with significantly less empty blue space than v9. The middle layer is dominated by the larger sharp premium metal lantern, visually strongest, with full handle, premium frosted diffuser, refined metal body, smaller integrated lower-body side control, and thin compact base visible. The lower layer is a very shallow deep dark table surface placed horizontally straight across the bottom of the square image: deep charcoal black wood, deep walnut wood, or dark stone. The table front edge must be horizontal and parallel to the bottom edge of the frame. The product sits squarely on the table. Keep the table dark, shallow, and secondary; do not create a large foreground table band. Do not use a side-placed table, diagonal table, slanted tabletop edge, angled tabletop perspective, medium brown wood, orange wood, bright tabletop, glossy table reflection, or a large foreground table area.

  Use a straight-on or slight three-quarter front camera angle at product height, shallow realistic product photography depth of field, reduced saturated blue-hour negative space around the handle and sides, premium metal outdoor electronics finish, crisp silhouette, subtle grounding shadow, strong contrast color grade, rich saturation, deeper blacks, clean metal highlights, and strong warm-versus-cool separation. The product should feel like the main square sales image, not a detail image and not a scenic camping landscape. Avoid every v9 weakness: no small product, no excessive blue emptiness, no oversized protruding knob, no thick heavy base, no smooth plastic diffuser, no generic plain cylinder. No brand text, no fake logo, no people, no hands, no open flame, no smoke, no extra lanterns, no watermark, no cyberpunk look, no toy plastic, no upper control knob, no top button, no bright or busy foreground, no strong foreground reflection, and no widescreen crop.

