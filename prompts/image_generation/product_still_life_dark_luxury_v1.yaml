prompt_package_id: product_still_life_dark_luxury_v1
version: v1
language: en
mode: text_to_image
reference_policy: text_only_no_image_input

title_cn: "深色奢华棚拍皮具图"
purpose_cn: "生成暗色高级皮具棚拍静物图"
scene_type: dark_luxury_studio
product_category: leather_goods
aspect_ratio: "4:5"
style_direction: "luxury dark studio still-life photography"

prompt: |
  Luxury dark studio still-life product photography. A black leather wallet sits on a matte charcoal stone slab, with subtle reflections and deep shadows. Minimal composition, premium low-key lighting, controlled highlights along the leather edges, visible stitching and grain, elegant cinematic contrast. Background nearly black, refined and expensive, no clutter, vertical 4:5.

negative_prompt: |
  people, hands, faces, readable brand logos, fake text, watermark, clutter, distorted objects, warped geometry, extra products, cyberpunk style, cartoon style, CGI plastic look, low resolution, overexposed highlights, messy background

acceptance_gate:
  prompt_subject_match: true
  style_direction_match: true
  no_person_or_face_unless_expected: true
  no_readable_text_or_logo_unless_expected: true
  commercial_usability: true

memory_write_allowed: false
daily_note_write_allowed: false
