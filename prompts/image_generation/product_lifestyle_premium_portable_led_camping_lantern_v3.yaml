prompt: |
  Realistic premium commercial product photography of a single modern rechargeable portable LED camping lantern as the hero product for an outdoor lifestyle main image. The product must dominate the first glance and feel valuable, modern, well-designed, and worth buying. Make the lantern larger, closer, and more decisive than a normal ambience shot. It has a matte graphite or dark anodized metal body with crisp manufactured edges, a warm frosted diffuser with readable material edge and thickness, an integrated continuous carry handle, a precision dimmer knob or machined side control, a subtle rechargeable outdoor electronics feel, and a compact stable non-slip base. It must clearly read as a modern premium LED camping lantern, not a flashlight, candle, speaker, humidifier, thermos, desk lamp, smart speaker, or vintage kerosene lantern.

  Set the scene at early blue hour shortly after sunset: the sky is a clean refined blue, not bright daytime, not orange sunset, and not black night. There is enough cool ambient light to preserve the dark body edges, handle shape, product silhouette, dimmer control, diffuser edge, and base shape. The lantern emits controlled warm LED light that draws the eye but does not clip or blow out the frosted diffuser; the diffuser center must keep a soft frosted gradient, not become a pure white block.

  Design a product-first three-layer hero composition. The upper layer is calm clean blue-hour sky around the handle. The middle layer is dominated by the oversized sharp lantern, complete and visually strongest, with full handle, diffuser, control detail, body edges, and base visible. The lower layer is a very dark restrained weathered wood tabletop or dark stone ledge, darker than the product and sky, with less foreground height, minimal texture, believable contact shadow, and only a small controlled warm reflection from the lantern. The background is only a distant, darker, strongly blurred second visual layer: soft tree line, faint tent silhouette, or tiny warm camp light far behind the product. Do not let the tent, tree, lake, mountain, camp light, or tabletop become the advertisement.

  Use a straight-on or slight three-quarter front camera angle at product height, shallow realistic product photography depth of field, clean negative space around the handle, premium outdoor electronics finish, crisp silhouette, subtle grounding shadow, and refined warm-versus-cool contrast. The product should feel like the main sales image, not a detail image and not a scenic camping landscape. No brand text, no fake logo, no people, no hands, no open flame, no smoke, no extra lanterns, no watermark, no cyberpunk look, no toy plastic, no bright or busy foreground, and no overexposed glow.

