prompt: |
  Create a realistic premium commercial square hero product image of a single modern rechargeable portable LED camping lantern for an outdoor lifestyle ecommerce main image. The image must be a fixed 1:1 square frame. The product must be centered, large, and immediately dominant, with very little wasted blue space. Keep the full handle, diffuser, body, small lower-body control, and thin base visible. The lantern should be a modern cylindrical premium camping lantern, not a square box lantern and not a vintage kerosene lantern. Use a dark graphite anodized aluminum or blackened metal body with refined machined rings, subtle bevels, crisp seams, and premium outdoor electronics detail. Use a large warm frosted cylindrical diffuser with fine even micro-texture, translucent side thickness, soft internal scattering, and a smooth amber gradient. The diffuser should look premium and clean, not dirty, not spotty, not water-stained, not coarse, not smooth cheap plastic, not clipped white, and not dim.

  Put the control detail on the lower body below the diffuser and above the base: a small integrated precision dimmer knob or button, dark metal or knurled black metal, refined and functional, not oversized and not protruding like an attached part. Use a thin compact premium dark metal base with a subtle foot ring and minimal stacked height. Avoid a thick, chunky, heavy, or oversized base. The product should feel modern, manufactured, compact, premium, and reliable.

  Set the scene at early blue hour shortly after sunset. The background is rich saturated deep blue dusk with a distant dark blurred tree line or very faint campsite silhouette only. The background is the second visual layer and must support the product, not compete with it. No bright background light dot, no orange sunset, no daylight sky, no black night scene. The lantern emits warm amber light through the fine frosted diffuser, creating strong warm-cool contrast against the deep blue background.

  Build a clean three-layer square composition: upper layer is controlled deep blue dusk sky closely framing the handle; middle layer is the large centered cylindrical lantern as the unmistakable first visual focus; lower layer is a very shallow dark horizontal table across the bottom, with the table front edge parallel to the bottom frame. Keep the table dark, low, quiet, and secondary. Do not create a large foreground table band, diagonal table, side-placed table, glossy reflection, medium brown tabletop, or bright tabletop.

  Use a straight-on or very slight three-quarter front camera angle at product height, sharp product focus, softly blurred background, premium contrast, deep blacks, clean metal highlights, rich deep blue, warm amber glow, and realistic commercial product photography. No brand text, no fake logo, no random letters, no watermark, no people, no hands, no open flame, no smoke, no extra products, no packaging, no CGI look, no illustration, no cartoon, no cyberpunk or gaming look.

