  Set the scene at early blue hour shortly after sunset. The sky and background are dark, saturated, and rich deep blue, not pale blue, not washed out, not bright daytime, not orange sunset, and not black night. The background should be a quiet dark blue outdoor atmosphere with a distant soft tree line or faint campsite silhouette only. There must be no visible bright background light dot and no camp light competing with the lantern. The lantern emits warm controlled LED glow; the diffuser should look clean, premium, frosted, translucent, and luminous with rich amber warmth. Do not create the v8 dirty or spotty diffuser problem. The diffuser must not look stained, dusty, mottled, cloudy, flat, cheap, blurry plastic, underexposed, or clipped white.

  Design a controlled product-first square three-layer hero composition. The upper layer is saturated deep blue-hour sky around the handle with controlled negative space. The middle layer is dominated by the large sharp premium metal lantern, visually strongest, with full handle, clean high-quality frosted diffuser, lower-body side control, metal body highlights, and compact refined base visible. The lower layer is a shallow deep dark table surface placed horizontally straight across the bottom of the square image: deep charcoal black wood, deep walnut wood, or dark stone. The table front edge must be horizontal and parallel to the bottom edge of the frame. The product sits squarely on the table. Keep the table shallow and secondary like v7; do not create the v8 oversized foreground table. Do not use a side-placed table, diagonal table, slanted tabletop edge, angled tabletop perspective, medium brown wood, orange wood, bright tabletop, glossy table reflection, or a large foreground table area.

  Use a straight-on or slight three-quarter front camera angle at product height, shallow realistic product photography depth of field, controlled saturated blue-hour negative space around the handle, premium metal outdoor electronics finish, crisp silhouette, subtle grounding shadow, strong contrast color grade, rich saturation, deeper blacks, and strong warm-versus-cool separation. The product should feel like the main square sales image, not a detail image and not a scenic camping landscape. Avoid every v8 regression: no smaller product, no dirty diffuser, no gray cheap shell, no chunky heavy base, no oversized tabletop, no dull low-quality material. No brand text, no fake logo, no people, no hands, no open flame, no smoke, no extra lanterns, no watermark, no cyberpunk look, no toy plastic, no upper control knob, no top button, no bright or busy foreground, no strong foreground reflection, and no widescreen crop.

