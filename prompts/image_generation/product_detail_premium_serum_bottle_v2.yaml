human_review_checklist:
  - Does the image clearly read as a controlled product-detail studio shot, not a broad hero or lifestyle scene?
  - Is exactly one premium skincare serum bottle present?
  - Is the full bottle visible from pipette top and cap down to the complete base?
  - Is the bottle vertical axis straight, with stable shoulders and a credible silhouette?
  - Is the dropper cap, collar, and pipette geometry clean and plausible?
  - Is the glass frosted or softly translucent with believable internal depth?
  - Is the label panel intentionally blank, centered, plain, and free of fake text, decorative marks, or logos?
  - Are product edges, glass highlights, label area, and base contact shadow readable?
  - Is the background neutral and inspection-oriented rather than decorative or lifestyle-driven?
  - Are people, hands, props, extra bottles, readable text, watermark, and packaging absent?
  - Does the result avoid cheap plastic, metallic-body drift, perfume-bottle drift, or medicine-bottle drift?

