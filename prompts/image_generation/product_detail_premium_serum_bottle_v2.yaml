prompt: |
  Realistic controlled studio product-detail photography of a single premium skincare serum bottle. This is a product fidelity inspection shot, not a broad ecommerce hero scene and not a lifestyle scene. The bottle must remain the only subject and fill the frame with close full-product detail while staying fully visible from the glass pipette top and dropper cap down to the complete bottle base.

  The bottle is frosted translucent glass with subtle internal depth and a softly tinted amber serum impression. It has a clean symmetric dropper cap, a smooth collar, a simple glass pipette top, straight shoulders, a stable vertical axis, and a centered intentionally blank label panel. The label area must be clean, flat, plain, and completely empty, with no fake text, no random letters, no logo, no decorative mark, and no broken label.

  Use precise soft studio lighting designed to reveal product structure: narrow controlled highlights on the glass edges, shoulder line, collar, dropper cap, label panel, and base edge; clean believable reflections; soft contact shadow under the complete base; product sharp across cap, label, glass body, and bottom edge. The background is a quiet warm-gray, ivory, pale stone, or soft neutral studio surface that supports inspection and never turns into a spa scene or lifestyle setup.

  Keep one complete serum bottle only, straight-on or very slight three-quarter front angle at product height, close full-product detail framing, realistic commercial product photography. No people, no hands, no props, no flowers, no leaves, no towels, no stones, no extra bottles, no packaging box, no readable text, no watermark, no pump dispenser, no perfume bottle drift, no medicine bottle drift, no cheap plastic, no metallic bottle body, no warped pipette, no crooked cap, no cropped bottle bottom, no cut-off cap, and no glare that hides product edges.

