prompt_package_id: product_lifestyle_coffee_table_v1
version: v1
language: en
mode: text_to_image
reference_policy: text_only_no_image_input

title_cn: "咖啡桌日常高级感静物图"
purpose_cn: "生成咖啡桌、皮具、墨镜和艺术书的生活方式图"
scene_type: coffee_table_lifestyle
product_category: daily_accessory
aspect_ratio: "4:5"
style_direction: "premium lifestyle still-life photography"

prompt: |
  Lifestyle still-life on a walnut coffee table. A beige leather wallet, black sunglasses, ceramic espresso cup, and open art book arranged naturally. Warm afternoon light, soft shadow, premium daily-life mood, realistic leather, paper, ceramic textures. Editorial product photography, calm and refined, vertical 4:5.

negative_prompt: |
  people, hands, faces, readable brand logos, fake text, watermark, clutter, distorted objects, warped geometry, extra products, cyberpunk style, cartoon style, CGI plastic look, low resolution, overexposed highlights, messy background

acceptance_gate:
  prompt_subject_match: true
  style_direction_match: true
  no_person_or_face_unless_expected: true
  no_readable_text_or_logo_unless_expected: true
  commercial_usability: true

memory_write_allowed: false
daily_note_write_allowed: false
