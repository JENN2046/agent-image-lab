prompt_package_id: product_still_life_wood_table_leather_v1
version: v1
language: en
mode: text_to_image
reference_policy: text_only_no_image_input

title_cn: "木桌自然光皮具静物图"
purpose_cn: "生成窗边自然光皮革钱包与日常小物静物图"
scene_type: window_light_wood_table
product_category: leather_goods
aspect_ratio: "4:5"
style_direction: "warm natural-light leather goods editorial photography"

prompt: |
  Premium leather goods still-life on a warm wooden table beside a window. A tan leather wallet, brass key ring, linen cloth, and small ceramic cup are arranged with calm spacing. Soft morning window light, gentle shadows, warm neutral palette, tactile leather grain, refined stitching, quiet luxury mood. Editorial product photography, realistic texture, shallow atmospheric depth, vertical 4:5.

negative_prompt: |
  people, hands, faces, readable brand logos, fake text, watermark, clutter, distorted objects, warped geometry, extra products, cyberpunk style, cartoon style, CGI plastic look, low resolution, overexposed highlights, messy background

acceptance_gate:
  prompt_subject_match: true
  style_direction_match: true
  no_person_or_face_unless_expected: true
  no_readable_text_or_logo_unless_expected: true
  commercial_usability: true

memory_write_allowed: false
daily_note_write_allowed: false
