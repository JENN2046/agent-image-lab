prompt: |
  Clean premium commercial product photo of a synthetic warm-white matte ceramic coffee mug as the only product subject. Three-quarter hero angle, full product visible, simple curved handle, subtle handmade rim detail, smooth low-sheen ceramic surface, soft diffused studio lighting, gentle contact shadow, minimal neutral tabletop, quiet negative space, catalog-ready realism, accurate mug geometry, natural proportions, refined but simple product presentation, vertical 4:5.

negative_prompt: |
  people, hands, faces, readable text, brand logo, watermark, extra products, duplicate mugs, malformed handle, broken rim, warped geometry, unrealistic ceramic texture, excessive gloss, cluttered background, harsh reflections, cyberpunk style, gaming HUD, cartoon style, CGI plastic look, low resolution, overexposed highlights, underexposed product, noisy image

acceptance_gate:
  prompt_subject_match: true
  style_direction_match: true
  no_person_or_face_unless_expected: true
  no_hands: true
  no_readable_text_or_logo_unless_expected: true
  single_product_subject: true
  plausible_product_geometry: true
  commercial_usability: true

memory_write_allowed: false
