prompt: |
  Realistic premium commercial product photography of a single modern rechargeable portable LED camping lantern as the hero product for an outdoor lifestyle main image. The image must be a fixed 1:1 square hero frame, not widescreen and not a horizontal banner. Keep the v6 direction for premium dark metal shell, dark blue background, and horizontal dark table, but make the product larger and closer in the square frame, closer to the v5 product scale. The lantern should occupy most of the square hero image while the full handle, diffuser, body, side dimmer, and base remain visible. Increase the whole image's contrast and saturation compared with v6: deeper blacks, richer deep blue background, warmer amber lantern glow, and cleaner metal highlights. The product has a dark graphite anodized aluminum or blackened metal body with satin metallic highlights, crisp machined edges, and subtle bevels; a warm frosted diffuser with tangible translucent material, visible side thickness, fine texture, and a richer amber gradient; an integrated continuous dark metal carry handle with plausible side mounts; a side-mounted precision knurled dimmer knob; subtle rechargeable outdoor electronics character; and a compact stable dark metal base. It must clearly read as a modern premium LED camping lantern, not a flashlight, candle, speaker, humidifier, thermos, desk lamp, smart speaker, or vintage kerosene lantern.

  Set the scene at early blue hour shortly after sunset. The sky and background are dark, saturated, and rich deep blue, not pale blue, not washed out, not bright daytime, not orange sunset, and not black night. The background should be a quiet dark blue outdoor atmosphere with a distant soft tree line or faint campsite silhouette only. There must be no visible bright background light dot and no camp light competing with the lantern. The lantern emits warm controlled LED glow; the diffuser should look like high-quality frosted translucent material, closer to the better v4 diffuser quality than v5, with richer amber warmth, not flat, not cheap, not blurry plastic, not underexposed, and not clipped white.

  Design a controlled product-first square three-layer hero composition. The upper layer is saturated deep blue-hour sky around the handle, with less empty sky than v6. The middle layer is dominated by the larger sharp premium metal lantern, visually strongest, with full handle, high-quality frosted diffuser, side dimmer, metal body highlights, and base visible. The lower layer is a shallow deep dark table surface placed horizontally straight across the bottom of the square image: deep charcoal black wood, deep walnut wood, or dark stone. The table front edge must be horizontal and parallel to the bottom edge of the frame. The product sits squarely on the table. Do not use a side-placed table, diagonal table, slanted tabletop edge, angled tabletop perspective, medium brown wood, orange wood, bright tabletop, glossy table reflection, or a large foreground table area.

  Use a straight-on or slight three-quarter front camera angle at product height, shallow realistic product photography depth of field, reduced but clean saturated blue-hour negative space around the handle, premium metal outdoor electronics finish, crisp silhouette, subtle grounding shadow, higher contrast color grade, richer saturation, deeper blacks, and stronger warm-versus-cool separation. The product should feel like the main square sales image, not a detail image and not a scenic camping landscape. No brand text, no fake logo, no people, no hands, no open flame, no smoke, no extra lanterns, no watermark, no cyberpunk look, no toy plastic, no gray cheap plastic shell, no dull low-contrast color, no bright or busy foreground, no strong foreground reflection, and no widescreen crop.

