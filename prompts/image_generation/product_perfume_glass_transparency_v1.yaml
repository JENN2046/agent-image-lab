prompt_package_id: product_perfume_glass_transparency_v1
version: v1
language: en
mode: text_to_image
reference_policy: text_only_no_image_input

title_cn: "香水玻璃透明质感静物图"
purpose_cn: "生成香水玻璃与皮具小包的高级透明质感图"
scene_type: perfume_glass_still_life
product_category: beauty
aspect_ratio: "4:5"
style_direction: "luxury perfume still-life photography"

prompt: |
  Luxury perfume still-life. A clear glass perfume bottle, beige leather pouch, and pale stone tray arranged under soft directional light. Elegant reflections, transparent glass highlights, warm neutral background, premium beauty campaign atmosphere. Realistic caustic light, refined composition, no text, no logo, vertical 4:5.

negative_prompt: |
  people, hands, faces, readable brand logos, fake text, watermark, clutter, distorted objects, warped geometry, extra products, cyberpunk style, cartoon style, CGI plastic look, low resolution, overexposed highlights, messy background

acceptance_gate:
  prompt_subject_match: true
  style_direction_match: true
  no_person_or_face_unless_expected: true
  no_readable_text_or_logo_unless_expected: true
  commercial_usability: true

memory_write_allowed: false
daily_note_write_allowed: false
