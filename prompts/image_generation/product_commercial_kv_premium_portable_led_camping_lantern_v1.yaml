human_review_checklist:
  - Does the product immediately read as a premium portable LED camping lantern?
  - Is the lantern the dominant hero product and fully visible?
  - Are the cylindrical body, handle, side pivots, diffuser, and base structurally plausible?
  - Is the warm LED glow believable, softly diffused, and not blown out?
  - Do the metal, diffuser, and base materials feel premium and tactile?
  - Is there clean negative space suitable for later headline placement without generated text?
  - Is the dusk outdoor background supportive rather than cluttered?
  - Are people, hands, logos, readable text, labels, watermarks, and QR codes absent?
  - Does the image feel like a campaign-grade commercial KV rather than a neutral smoke test?
  - Would the asset be eligible for accepted_candidate only after human review?

