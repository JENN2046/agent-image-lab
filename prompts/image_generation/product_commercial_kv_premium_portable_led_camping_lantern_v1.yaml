negative_prompt: |
  readable text, generated text, random letters, logo, brand mark, fake brand, label text, watermark, signature, QR code,
  people, hands, faces, model, human body,
  extra lanterns, duplicated product, cropped product, product too small, product hidden by props,
  oil lamp, kerosene lantern, flashlight, speaker, bottle, generic glowing cylinder,
  broken handle, missing handle pivots, floating handle, impossible handle geometry, warped cylinder, melted body, unstable base,
  overexposed light core, blown-out glow, magical aura, unrealistic light beams, noisy reflections,
  cluttered campsite, busy gear pile, readable map, branded cup, fire touching product, messy background,
  CGI look, plastic toy look, cartoon, illustration, low resolution, over-sharpened, muddy material, poor contact shadow

negative_constraints:
  product_identity:
    - do not turn the lantern into an oil lamp, kerosene lantern, flashlight, speaker, bottle, or generic glowing cylinder
    - do not add extra lanterns or product variants
  structure:
    - keep one compact cylindrical LED lantern with a clean arched carry handle
    - keep side handle pivots visible and physically plausible
    - do not crop the product, remove the handle, melt the body, or create impossible geometry
  commercial_kv:
    - keep clean negative space suitable for later headline placement
    - do not generate text, logos, labels, fake brand marks, watermarks, signatures, or QR codes
    - keep the product dominant and immediately readable as the hero
  lighting:
    - keep the warm LED glow softly diffused and believable
    - do not create blown-out light cores, magical aura, or unrealistic beams
  scene:
    - no people, hands, or faces
    - no cluttered camping gear pile
    - no readable maps or branded props
    - no fire touching or obscuring the product

