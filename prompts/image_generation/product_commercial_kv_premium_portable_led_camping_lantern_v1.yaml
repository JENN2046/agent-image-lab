product_identity:
  product_type: premium_portable_led_camping_lantern
  product_category: outdoor_lighting_product
  category_terms:
    - premium portable LED camping lantern
    - modern outdoor lantern
    - rechargeable camp light
    - compact lifestyle lighting product
  must_not_be:
    - oil lamp
    - kerosene lantern
    - flashlight
    - speaker
    - bottle
    - generic glowing cylinder

commercial_kv_strategy:
  usage: brand_campaign_key_visual
  target_quality: commercial_kv_candidate
  audience_read: premium outdoor lifestyle, design-conscious camping gear buyer
  hero_message_without_text: "quiet premium outdoor readiness, warm light, reliable design"
  composition_priority:
    - product-first hero read
    - premium material and light behavior
    - clean negative space suitable for later headline placement
    - believable outdoor context without clutter
  production_boundary:
    generated_text_allowed: false
    logo_allowed: false
    watermark_allowed: false
    people_allowed: false
    hands_allowed: false

structure_lock:
  locked_structure: compact_cylindrical_lantern_with_handle_and_visible_led_diffuser
  body: matte dark graphite or warm brushed metal cylindrical housing
  light_core: warm translucent LED diffuser, softly glowing from inside
  handle: clean arched carry handle attached to visible side pivots
  controls: minimal non-readable button detail only
  extra_products_allowed: false
  malformed_handle_allowed: false
  impossible_glow_allowed: false

scene_direction:
  shot_type: premium commercial outdoor product key visual
  aspect_ratio: "9:16"
  camera_angle: low three-quarter hero angle, product slightly above eye level or at tabletop height
  surface: dark stone, weathered wood, or refined outdoor tabletop with realistic contact shadow
  background: deep dusk forest or mountain campsite atmosphere, softly blurred, not busy
  text_safe_zone: upper third or left side clean negative space with no generated text
  props_allowed: restrained context only, such as one folded canvas cloth or small shadowed rock
  props_forbidden:
    - labels
    - maps with readable text
    - cups with logos
    - busy camping gear pile
    - fire flames touching the product

lighting_camera_language:
  lighting_quality: premium cinematic dusk product photography
  product_light: warm amber lantern glow, believable diffusion, no blown-out center
  external_light: soft cool blue dusk rim light on metal edges
  material_detail: crisp matte metal, brushed texture, rubberized base, translucent diffuser
  shadow: grounded contact shadow and subtle reflected warm light on surface
  depth_of_field: product sharp, background softly blurred
  realism: realistic commercial photography, not CGI, not illustration

runner_prompt_mapping:
  canonical_prompt_field: prompt
  positive_prompt_retained_for_review: true
  runner_expected_prompt_field: prompt
  positive_prompt_sync_required: true

prompt: |
  Create a vertical premium commercial key visual for a modern portable LED camping lantern. The lantern is the clear hero product: a compact cylindrical outdoor light with a matte dark graphite or warm brushed metal body, a warm translucent LED diffuser glowing softly from within, a clean arched carry handle attached to visible side pivots, a stable rubberized base, and minimal non-readable button details. The product must be fully visible, sharply focused, structurally believable, and visually dominant.

  Compose the image like a high-end outdoor gear campaign KV. Place the lantern on a dark stone, weathered wood, or refined outdoor tabletop with a realistic contact shadow and a small pool of warm reflected light. Use a low three-quarter hero camera angle and premium product photography framing. Keep clean negative space in the upper third or on the left side for later headline placement, but do not generate any text. The background should suggest a quiet dusk campsite, forest edge, or distant mountain atmosphere, softly blurred and elegant, never cluttered.

  Lighting should combine warm amber lantern glow with cool blue dusk rim light on the metal edges. The glow must be believable and softly diffused, not overexposed and not a magical aura. Show tactile material detail: matte metal or brushed metal texture, translucent diffuser, subtle seams, handle pivots, stable base, and refined product edges. The mood is premium, calm, reliable, design-conscious outdoor lifestyle.

  The final image should look like a real commercial photography campaign asset suitable for a brand key visual: product-first, polished, emotionally warm, with strong silhouette, readable structure, premium material, clean composition, and clear advertising usability. No people, no hands, no readable text, no logo, no watermark, no labels, no fake brand marks, no QR codes, no generated typography, no extra lanterns.

