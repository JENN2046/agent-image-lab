prompt_package_id: product_minimal_business_desk_v1
version: v1
language: en
mode: text_to_image
reference_policy: text_only_no_image_input

title_cn: "极简商务办公桌皮具静物图"
purpose_cn: "生成办公桌场景下的商务皮具与文具静物图"
scene_type: minimal_business_desk
product_category: business_accessory
aspect_ratio: "4:5"
style_direction: "premium minimal desk still-life photography"

prompt: |
  Premium minimal desk still-life. A tan leather wallet, matte black pen, slim notebook, and small metal paperclip arranged on a clean stone-gray desk surface. Soft window light, subtle shadows, refined business lifestyle mood. Realistic leather grain, precise composition, calm professional atmosphere, vertical 4:5.

negative_prompt: |
  people, hands, faces, readable brand logos, fake text, watermark, clutter, distorted objects, warped geometry, extra products, cyberpunk style, cartoon style, CGI plastic look, low resolution, overexposed highlights, messy background

acceptance_gate:
  prompt_subject_match: true
  style_direction_match: true
  no_person_or_face_unless_expected: true
  no_readable_text_or_logo_unless_expected: true
  commercial_usability: true

memory_write_allowed: false
daily_note_write_allowed: false
