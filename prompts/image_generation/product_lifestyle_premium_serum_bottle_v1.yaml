  - Is the bottle frosted or softly translucent glass rather than cheap plastic?
  - Is the clean dropper cap structure intact, symmetric, and not a pump dispenser?
  - Are the glass, cap, and label highlights soft and controlled?
  - Is the label area elegant, blank or non-readable, and free of fake text?
  - Is there no readable brand logo, watermark, or random lettering?
  - Does the product remain dominant at roughly 60-75% visual importance?
  - Is the full bottle visible without cap or base cropping?
  - Does the background feel subtle, premium, and supportive rather than overpowering?
  - Are people, hands, props, extra bottles, and overdecorated spa clutter absent?
