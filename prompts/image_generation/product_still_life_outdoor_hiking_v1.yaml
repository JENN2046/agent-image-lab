prompt_package_id: product_still_life_outdoor_hiking_v1
version: v1
language: en
mode: text_to_image
reference_policy: text_only_no_image_input

title_cn: "户外徒步装备静物图"
purpose_cn: "生成户外徒步装备与帽子小包的自然商业静物图"
scene_type: outdoor_hiking_still_life
product_category: outdoor_accessory
aspect_ratio: "4:5"
style_direction: "premium outdoor lifestyle still-life photography"

prompt: |
  Premium outdoor lifestyle still-life product photography. A light khaki mesh outdoor cap, a compact beige utility pouch, and a rolled-up trail map are arranged on a rough stone surface beside dry grass. Morning sunlight from the side creates long soft shadows. Natural earthy color palette, sand, olive, stone gray, muted black. Editorial outdoor gear campaign mood, quiet and premium, realistic fabric texture, breathable mesh details, clean composition, 4:5 vertical frame, no people.

negative_prompt: |
  people, hands, faces, readable brand logos, fake text, watermark, clutter, distorted objects, warped geometry, extra products, cyberpunk style, cartoon style, CGI plastic look, low resolution, overexposed highlights, messy background

acceptance_gate:
  prompt_subject_match: true
  style_direction_match: true
  no_person_or_face_unless_expected: true
  no_readable_text_or_logo_unless_expected: true
  commercial_usability: true

memory_write_allowed: false
daily_note_write_allowed: false
