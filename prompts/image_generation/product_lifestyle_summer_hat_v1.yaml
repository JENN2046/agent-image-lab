prompt_package_id: product_lifestyle_summer_hat_v1
version: v1
language: en
mode: text_to_image
reference_policy: text_only_no_image_input

title_cn: "夏日户外帽子场景图"
purpose_cn: "生成透气网格帽户外夏日静物图"
scene_type: summer_outdoor_hat
product_category: cap
aspect_ratio: "4:5"
style_direction: "outdoor summer product still-life photography"

prompt: |
  Outdoor summer product still-life featuring a light beige mesh cap placed on a sunlit stone bench. Nearby are a folded lightweight jacket, a small black carabiner, and dry grass shadows. Emphasize breathable mesh texture, light fabric, outdoor functionality, premium calm travel mood. Natural sunlight, crisp shadows, realistic material detail, vertical 4:5.

negative_prompt: |
  people, hands, faces, readable brand logos, fake text, watermark, clutter, distorted objects, warped geometry, extra products, cyberpunk style, cartoon style, CGI plastic look, low resolution, overexposed highlights, messy background

acceptance_gate:
  prompt_subject_match: true
  style_direction_match: true
  no_person_or_face_unless_expected: true
  no_readable_text_or_logo_unless_expected: true
  commercial_usability: true

memory_write_allowed: false
daily_note_write_allowed: false
