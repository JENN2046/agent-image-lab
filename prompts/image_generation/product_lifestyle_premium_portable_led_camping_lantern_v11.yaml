prompt: |
  Realistic premium commercial product photography of a single modern rechargeable portable LED camping lantern as the hero product for a clean ecommerce SKU main image with refined blue-hour mood. The product must dominate the first glance and feel valuable, modern, well-designed, and worth buying. Make the lantern large, complete, and decisive, not a scenic ambience detail. It has a matte graphite or dark anodized metal body with crisp manufactured edges and readable lower body detail, a warm frosted diffuser with readable material edge and thickness, an attached continuous carry or hanging handle, a visible precision dimmer knob or machined side control, a subtle rechargeable outdoor electronics feel, and a compact stable non-slip base. It must clearly read as a modern premium LED camping lantern, not a flashlight, candle, speaker, humidifier, thermos, desk lamp, smart speaker, or vintage kerosene lantern.

  Use a clean product-first blue-hour setting. The background is simpler than a lifestyle campsite hero: calm cool blue negative space, softly blurred dark outdoor cues, or a very subtle distant shape only. Do not make a busy campsite, tent, tree line, lake, mountain, camp light, or tabletop the advertisement. The wider scene hero route remains separate; this prompt is for strict SKU-focused product framing. There is enough cool ambient light to preserve the dark body edges, lower body detail, handle shape, product silhouette, side control, diffuser edge, and base shape. The lantern emits controlled warm LED light that draws the eye but does not clip or blow out the frosted diffuser; the diffuser center keeps a soft frosted gradient, not a pure white block.

  Design a clean three-layer product composition. The upper layer is calm refined blue-hour negative space around the handle. The middle layer is dominated by the oversized sharp lantern, complete and visually strongest, with full handle, diffuser, side control, body edges, lower body detail, and base visible. The lower layer is a shallow restrained dark product surface, darker than the product and sky, with minimal texture, believable contact shadow, and only a small controlled warm reflection. The surface grounds the lantern but stays secondary; the product is larger and more important than the surface reflection.

  Use a straight-on or slight three-quarter front camera angle at product height, realistic commercial product photography depth of field, clean negative space around the handle, premium outdoor electronics finish, crisp silhouette, subtle grounding shadow, and refined warm-versus-cool contrast. No brand text, no fake logo, no people, no hands, no open flame, no smoke, no extra lanterns, no watermark, no cyberpunk look, no toy plastic, no busy campsite background, no foreground table dominance, no featureless black lower body, no missing side control knob, no lost or cropped handle geometry, and no overexposed glow.

