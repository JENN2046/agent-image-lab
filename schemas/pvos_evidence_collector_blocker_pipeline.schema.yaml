pvos_evidence_collector_blocker_pipeline:
  version: v1
  mode: local_stdout_only_evidence_collector_blocker_pipeline
  input_policy:
    approved_local_fixture: true
    allowed_root: tests/schema_examples
    allowed_fixture_pairs:
      - input_ref: tests/schema_examples/pvos_kernel_input.example.json
        protocol_input_ref: tests/schema_examples/review_result_protocol_input.example.json
      - input_ref: tests/schema_examples/pvos_kernel_negative_guard_input.example.json
        protocol_input_ref: tests/schema_examples/review_result_protocol_negative_guard_input.example.json
  required_outputs:
    evidence_records: array
    blocker_decisions: array
    review_report: object
    memory_delta_drafts: array
    production_exclusion_drafts: array
  review_console_handoff:
    handoff_id: string
    display_only: true
    evidence_blocker_contract_attached: true
    review_blocker_arbiter_attached: true
    review_report_contract_attached: true
    memory_delta_drafts_attached: true
    production_exclusion_drafts_attached: true
  guard:
    stdout_only: true
    local_only: true
    all_outputs_are_drafts: true
    production_candidate_created: false
    direct_memory_write_performed: false
    daily_note_write_performed: false
    vcp_memory_write_performed: false
    accepted_samples_write_performed: false
    provider_contact_performed: false
    plugin_call_performed: false
    api_call_performed: false
    image_generation_performed: false
    output_file_write_performed: false
