# local_regression_suite.schema.yaml
# Local regression suite manifest for artifact lifecycle validators.

local_regression_suite:
  version: v1
  suite_id: v14_150_local_regression_suite_consolidation
  execution_mode: local_validator_runner_only
  output_mode: stdout_json
  output_file_write_allowed: false

validator_scope:
  included_phases:
    - v14_141_recoverability_core_extraction
    - v14_142_multi_accepted_sample_matrix
    - v14_143_import_review_registry_schema_hardening
    - v14_144_review_console_schema_binding
    - v14_145_sample_lifecycle_state_machine
    - v14_146_durable_archive_dry_run_manifest
    - v14_147_production_candidate_eligibility_preflight
    - v14_148_memory_delta_draft_package
    - v14_149_authorization_package_compiler
  excluded_runtime_scopes:
    - provider_API_plugin_MCP
    - real_manifest_read
    - VCPChat_read_or_write
    - VCPToolBox_read_or_write
    - DailyNote_write
    - VCP_memory_write
    - image_generation
    - production_candidate_write
    - push_tag_release_deploy

pass_contract:
  all_validators_must_exit_zero: true
  all_validator_json_must_have_passed_true: true
  failure_records_must_include_phase_and_command: true
  suite_passed_requires_all_children_passed: true

non_authorization:
  provider_contact_performed: false
  plugin_call_performed: false
  api_call_performed: false
  mcp_runtime_performed: false
  image_generation_performed: false
  real_manifest_read_performed: false
  real_vcpchat_read_performed: false
  real_vcptoolbox_read_performed: false
  accepted_samples_write_performed: false
  failure_samples_write_performed: false
  production_candidate_write_performed: false
  DailyNote_write_performed: false
  VCP_memory_write_performed: false
  push_tag_release_deploy_performed: false
