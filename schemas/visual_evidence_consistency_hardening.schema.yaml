schema_id: visual_evidence_consistency_hardening
version: v0_1
status: local_contract_schema_only
phase: v0_4_9_visual_evidence_consistency_hardening
purpose: >
  Defines metadata-only evidence consistency checks across review pack, receipt,
  attempt result, authorization registry, and visual dry-run report.

required_top_level_fields:
  - evidence_consistency_id
  - version
  - phase
  - source_review_pack_ref
  - source_dry_run_report_ref
  - source_authorization_registry_ref
  - source_receipt_path
  - source_attempt_result_path
  - asset_evidence
  - consistency_rules
  - boundaries
  - side_effects

asset_evidence:
  asset_id: string
  task_id: string
  receipt_path: string
  attempt_result_path: string
  output_image_sha256: sha256_string
  asset_class: string
  raw_local_path_included: false
  image_binary_read_performed: false

consistency_rules:
  asset_id_consistent: true
  receipt_path_consistent: true
  attempt_result_path_consistent: true
  output_image_sha256_consistent: true
  no_raw_local_path: true
  no_image_binary_read: true

boundaries:
  metadata_only: true
  dry_run_only: true
  image_binary_read_performed: false
  provider_call_performed: false
  image_generation_performed: false
  VCP_memory_write_performed: false
  DailyNote_write_performed: false
  runtime_call_performed: false
  secret_value_read_performed: false
  production_candidate_created: false
  accepted_sample_auto_promotion: false
  memory_seed_promoted: false
  real_executor_implemented_now: false
  Push_L2_exercised: false

side_effects:
  provider_call_performed: false
  image_generation_performed: false
  VCP_memory_write_performed: false
  DailyNote_write_performed: false
  runtime_call_performed: false
  secret_value_read_performed: false
  production_candidate_created: false
  accepted_sample_auto_promotion: false
  memory_seed_promoted: false
  package_dependency_change_performed: false
  commit_performed: false
  push_performed: false
