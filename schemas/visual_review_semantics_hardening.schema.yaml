schema_id: visual_review_semantics_hardening
version: v0_1
status: local_contract_schema_only
phase: v0_4_8_visual_review_semantics_hardening
purpose: >
  Defines metadata-only semantic hardening for a visual review report so decision
  fields cannot be present but empty of judgment.

required_top_level_fields:
  - semantic_hardening_id
  - version
  - phase
  - source_review_pack_ref
  - source_failure_taxonomy_ref
  - source_prompt_correction_hint_ref
  - low_score_threshold
  - review_decision
  - low_score_findings
  - semantic_constraints
  - boundaries
  - side_effects

review_decision:
  result: pass | patch | reject
  blocking_failures: array
  failure_taxonomy: array
  correction_hint_ref: string | null
  correction_hint_categories: array
  memory_suitability: false

semantic_constraints:
  pass_blocks_blocking_failure: true
  reject_requires_failure_taxonomy: true
  patch_requires_correction_hint: true
  low_score_requires_finding: true
  memory_suitability_stays_false: true

low_score_findings:
  dimension: composition | lighting | material_realism | product_fidelity | commercial_fitness | ai_artifact_risk
  score: integer
  finding: non_empty_string
  mapped_failure_category: commercial_fitness_failure | ai_artifact_failure | composition_failure | lighting_failure | material_realism_failure | product_fidelity_failure

boundaries:
  metadata_only: true
  dry_run_only: true
  image_binary_read_performed: false
  provider_call_performed: false
  image_generation_performed: false
  VCP_memory_write_performed: false
  DailyNote_write_performed: false
  runtime_call_performed: false
  secret_value_read_performed: false
  production_candidate_created: false
  accepted_sample_auto_promotion: false
  memory_seed_promoted: false
  real_executor_implemented_now: false
  Push_L2_exercised: false

side_effects:
  provider_call_performed: false
  image_generation_performed: false
  VCP_memory_write_performed: false
  DailyNote_write_performed: false
  runtime_call_performed: false
  secret_value_read_performed: false
  production_candidate_created: false
  accepted_sample_auto_promotion: false
  memory_seed_promoted: false
  package_dependency_change_performed: false
  commit_performed: false
  push_performed: false
