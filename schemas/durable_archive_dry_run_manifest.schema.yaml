# durable_archive_dry_run_manifest.schema.yaml
# Local planning contract for a future durable archive write.

durable_archive_dry_run_manifest:
  version: v1
  manifest_type: durable_archive_dry_run
  execution_mode: local_schema_fixture_validator_only
  authorization_granted_by_this_manifest: false

sample_identity:
  sample_id: string
  category: string
  lifecycle_state_required: recoverable
  production_candidate_status_required: not_created

source_artifact:
  source_artifact_ref: project_relative_runs_path
  source_import_record_ref: project_relative_json_path
  source_review_record_ref: docs_path
  source_human_approval_ref: docs_path
  source_registry_ref: accepted_samples/accepted_sample_registry.yaml
  source_category_index_ref: accepted_samples/categories/<category>.yaml

recoverability_evidence:
  sha256: sha256
  dimensions: widthxheight
  mime: image/jpeg | image/png | image/webp
  verification_record_ref: docs_path
  artifact_locator_scope: project_relative_runs
  portable_after_clone: boolean

planned_archive_target:
  archive_root_ref: asset_archive/accepted/<category>/<sample_id>/
  archive_manifest_ref: asset_archive/accepted/<category>/<sample_id>/archive_manifest.yaml
  archived_artifact_ref: asset_archive/accepted/<category>/<sample_id>/<artifact_filename>
  path_scope: project_relative_only
  absolute_paths_allowed: false
  path_escape_allowed: false

dry_run_guards:
  dry_run_only: true
  archive_manifest_written: false
  image_binary_copy_performed: false
  target_archive_directory_created: false
  target_archive_artifact_created: false
  runs_source_image_modified: false
  production_candidate_created: false
  DailyNote_write_performed: false
  VCP_memory_write_performed: false
  provider_contact_performed: false
  plugin_call_performed: false
  api_call_performed: false
  mcp_runtime_performed: false
  image_generation_performed: false
  real_manifest_read_performed: false
  real_vcpchat_read_performed: false
  real_vcptoolbox_read_performed: false
  push_tag_release_deploy_performed: false

negative_case_requirements:
  missing_recoverability_blocks_manifest: true
  hash_mismatch_blocks_manifest: true
  target_path_escape_blocks_manifest: true
  absolute_target_path_blocks_manifest: true
  existing_archive_target_requires_A5_review: true
