pvos_kernel_dry_run_adapter_response:
  schema_version: v1
  purpose: >
    Descriptive schema for the local PVOS kernel dry-run adapter response. It
    maps a pvos_kernel_run draft to future VCP adapter and Review Console
    handoff drafts without authorizing execution.
  required_top_level_fields:
    - pvos_kernel_dry_run_adapter_response_version
    - adapter_id
    - request_id
    - status
    - mode
    - kernel_run
    - review_result_protocol_report
    - review_result_protocol_handoff_draft
    - review_decision_package
    - review_decision_package_handoff_draft
    - evidence_blocker_contract
    - evidence_blocker_contract_handoff_draft
    - vcp_adapter_handoff_draft
    - review_console_handoff_draft
    - provenance_handoff_draft
    - audit_record
    - no_execution_guard
  adapter_id:
    enum:
      - pvos_kernel_dry_run_adapter
  mode:
    enum:
      - local_no_execution_adapter_contract
  status:
    enum:
      - accepted_draft
      - rejected
  vcp_adapter_handoff_draft:
    selected_plugin: null
    max_plugin_calls: 0
    execution_authorized: false
    provider_contact_allowed: false
    plugin_call_allowed: false
    api_call_allowed: false
    output_write_allowed: false
    expected_outputs: 0
  review_result_protocol_report:
    review_result_protocol_report_version: v1
    mode: local_stdout_only_review_result_protocol
    required_contracts:
      pass_requires_non_empty_pass_reasons: true
      reject_requires_non_empty_reject_reasons: true
      memory_route_required: true
      production_route_required: true
      production_candidate_created: false
  review_result_protocol_handoff_draft:
    status: draft_ready
    production_candidate_created: false
    direct_memory_write_performed: false
    never_production_candidate_ids: array
    memory_forbidden_count: integer
    memory_forbidden_candidate_ids: array
    production_blocked_count: integer
    all_production_candidate_creation_blocked: true
    negative_guard_observed: boolean
    required_review_fields:
      - review_outcome
      - pass_reasons
      - reject_reasons
      - memory_route
      - production_route
  review_decision_package:
    review_decision_package_version: v1
    status: completed_local_decision_package
    mode: local_stdout_only_review_decision_package
    accepted_sample_drafts: array
    rejected_sample_drafts: array
    memory_delta_drafts: array
    memory_forbidden_records: array
    production_exclusion_register: array
    decision_summary:
      direct_memory_write_performed: false
      production_candidate_created: false
      accepted_samples_write_performed: false
    promotion_guard:
      protocol_pass_is_not_production_approval: true
      every_never_production_candidate_blocked: true
      production_candidate_created: false
      direct_memory_write_performed: false
  review_decision_package_handoff_draft:
    status: draft_ready
    accepted_sample_draft_count: integer
    rejected_sample_draft_count: integer
    memory_delta_draft_count: integer
    memory_forbidden_count: integer
    production_exclusion_count: integer
    accepted_sample_ids: array
    rejected_sample_ids: array
    memory_delta_ids: array
    memory_forbidden_candidate_ids: array
    production_exclusion_candidate_ids: array
    direct_memory_write_performed: false
    production_candidate_created: false
    accepted_samples_write_performed: false
    protocol_pass_is_not_production_approval: true
    every_never_production_candidate_blocked: true
    required_decision_fields:
      - accepted_sample_drafts
      - rejected_sample_drafts
      - memory_delta_drafts
      - memory_forbidden_records
      - production_exclusion_register
      - promotion_guard
  evidence_blocker_contract:
    evidence_blocker_contract_version: v1
    status: completed_local_evidence_blocker_contract
    mode: local_stdout_only_evidence_blocker_contract
    evidence_records: array
    blocker_decisions: array
    production_exclusion_register: array
    blocker_summary:
      evidence_record_count: integer
      blocker_decision_count: integer
      production_exclusion_count: integer
      permanent_block_count: integer
      human_review_block_count: integer
      memory_forbidden_block_count: integer
      direct_memory_write_performed: false
      production_candidate_created: false
      accepted_samples_write_performed: false
    arbitration_guard:
      evidence_record_is_not_approval: true
      blocker_decision_is_not_write: true
      every_candidate_has_evidence_record: true
      every_candidate_has_production_blocker_decision: true
      every_never_production_candidate_has_exclusion: true
      no_production_without_human_review: true
      production_candidate_created: false
      direct_memory_write_performed: false
      accepted_samples_write_performed: false
  evidence_blocker_contract_handoff_draft:
    status: draft_ready
    evidence_record_count: integer
    blocker_decision_count: integer
    production_exclusion_count: integer
    permanent_block_count: integer
    human_review_block_count: integer
    memory_forbidden_block_count: integer
    human_review_blocked_candidate_ids: array
    memory_forbidden_candidate_ids: array
    production_exclusion_candidate_ids: array
    direct_memory_write_performed: false
    production_candidate_created: false
    accepted_samples_write_performed: false
    evidence_record_is_not_approval: true
    blocker_decision_is_not_write: true
    every_candidate_has_evidence_record: true
    every_candidate_has_production_blocker_decision: true
    every_never_production_candidate_has_exclusion: true
    no_production_without_human_review: true
    required_evidence_blocker_fields:
      - evidence_records
      - blocker_decisions
      - production_exclusion_register
      - blocker_summary
      - arbitration_guard
  review_console_handoff_draft:
    display_only: true
    human_review_required_for_production: true
    memory_write_requires_separate_approval: true
    review_result_protocol_report_attached: true
    review_decision_package_attached: true
    evidence_blocker_contract_attached: true
    review_protocol_guard_summary:
      never_production_count: integer
      memory_forbidden_count: integer
      production_candidate_created: false
      direct_memory_write_performed: false
      negative_guard_observed: boolean
    review_decision_package_guard_summary:
      accepted_sample_draft_count: integer
      rejected_sample_draft_count: integer
      memory_delta_draft_count: integer
      memory_forbidden_count: integer
      production_exclusion_count: integer
      production_candidate_created: false
      direct_memory_write_performed: false
      accepted_samples_write_performed: false
    review_evidence_blocker_contract_guard_summary:
      evidence_record_count: integer
      blocker_decision_count: integer
      production_exclusion_count: integer
      permanent_block_count: integer
      human_review_block_count: integer
      memory_forbidden_block_count: integer
      production_candidate_created: false
      direct_memory_write_performed: false
      accepted_samples_write_performed: false
      every_candidate_has_evidence_record: true
      every_candidate_has_production_blocker_decision: true
      every_never_production_candidate_has_exclusion: true
    forbidden_actions:
      - execute_plugin
      - call_api
      - write_daily_note
      - save_image
      - write_accepted_samples
  provenance_handoff_draft:
    provider_payload_included: false
    image_binary_included: false
    private_path_included: false
    artifact_refs_are_metadata_only: true
  no_execution_guard:
    execution_authorized: false
    provider_contact_allowed: false
    plugin_call_allowed: false
    api_call_allowed: false
    daily_note_write_allowed: false
    vcp_memory_write_allowed: false
    image_generation_allowed: false
    output_file_write_allowed: false
    accepted_samples_write_allowed: false
    production_candidate_write_allowed: false
    external_manifest_read_allowed: false
    provider_contact_performed: false
    plugin_call_performed: false
    api_call_performed: false
    daily_note_write_performed: false
    vcp_memory_write_performed: false
    image_generation_performed: false
    output_file_write_performed: false
    accepted_samples_write_performed: false
    production_candidate_created: false
    external_manifest_read_performed: false
    vcpchat_source_read_performed: false
    vcptoolbox_source_read_performed: false
  output_policy:
    output_channel: stdout
    output_file_write_allowed: false
    committed_example_is_shape_reference_only: true
