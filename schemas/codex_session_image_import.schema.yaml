# codex_session_image_import.schema.yaml
# Manual import record for images generated by Codex session image tooling.
# This schema is a contract document, not an executable provider adapter.

codex_session_image_import:
  import_version: v1
  import_id: string
  provider_id: codex_session_image
  import_mode: manual_session_import
  status: draft_import_record | imported_pending_review | review_linked | rejected

  source:
    codex_session_generation: boolean
    codex_image_direct_call_allowed: false
    mcp_runtime_allowed: false
    provider_api_call_allowed: false
    project_script_generation_allowed: false
    image_generation_by_script: false
    human_session_action_required: true

  prompt_package_ref: string
  prompt_package_id: string | null
  generation_notes_cn: string | null

  imported_asset:
    output_directory_ref: string
    file_name: string
    relative_path: string
    mime_type: image/jpeg | image/png | image/webp
    width_px: integer | null
    height_px: integer | null
    aspect_ratio: string | null
    sha256: string | null
    local_file_verified: boolean
    copied_by_project_script: false

  review_bridge:
    image_case_id: string | null
    review_status: pending_human_review | needs_revision | rejected | accepted_candidate_with_human_approval
    accepted_candidate: boolean
    commercial_delivery_ready: boolean
    memory_suitability: deferred | rejected | pending_human_memory_review
    review_record_ref: string | null

  no_execution_guard:
    provider_contact_allowed: false
    plugin_call_allowed: false
    api_call_allowed: false
    image_generation_allowed_by_project: false
    env_local_secret_value_read_allowed: false
    DailyNote_write_allowed: false
    VCP_memory_write_allowed: false
    accepted_samples_write_allowed: false
    production_candidate_write_allowed: false
    real_manifest_read_allowed: false
    real_VCPChat_read_allowed: false
    real_VCPToolBox_read_allowed: false
    push_tag_release_deploy_allowed: false

    provider_contact_performed_by_project: false
    plugin_call_performed_by_project: false
    api_call_performed_by_project: false
    image_generation_performed_by_project: false
    env_local_secret_value_read_performed: false
    DailyNote_write_performed: false
    VCP_memory_write_performed: false
    accepted_samples_write_performed: false
    production_candidate_write_performed: false
    real_manifest_read_performed: false
    real_VCPChat_read_performed: false
    real_VCPToolBox_read_performed: false
    push_tag_release_deploy_performed: false

  invariants:
    - codex_image_direct_call_allowed must remain false until a stable callable API exists and is separately authorized.
    - mcp_runtime_allowed must remain false in the minimal import contract.
    - project scripts must not generate the image.
    - import records do not authorize accepted_samples, production_candidate, DailyNote, or VCP memory writes.
    - accepted_candidate true requires a separate human review decision, not just an import record.
