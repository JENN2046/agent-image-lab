# task_envelope.schema.yaml
# 任务包草案：描述一次视觉任务从需求到评审、归档、记忆的上下文
task_envelope:
  task_id: string                 # 任务唯一 ID
  created_at: string              # 创建时间
  project: string                 # 项目名
  requester: string               # 请求人或来源
  task_type: string               # 任务类型
  mode: dry_run | review_only | generation | refinement # 任务模式
  status: draft | planned | reviewing | archived | rejected # 当前状态
  user_request_cn: string         # 用户原始需求的中文整理
  visual_goal_cn: string          # 视觉目标中文描述
  business_context_cn: string     # 业务背景中文描述
  input_assets:                   # 输入资产引用，不存图片二进制
    images:
      - string                    # 图片占位路径或外部引用
    references:
      - string                    # 参考资产引用
    notes:
      - string                    # 中文备注
  director_plan:                  # Director_Agent 输出的视觉方向
    image_type: string            # 图片类型
    composition_strategy_cn: string # 构图策略中文说明
    style_boundary_cn: string     # 风格边界中文说明
    preserve_cn:
      - string                    # 必须保留项
    change_cn:
      - string                    # 需要修改项
    avoid_cn:
      - string                    # 必须避免项
  prompt_package_ref: string | null # prompt_package 引用
  dispatch_plan_ref: string | null # dispatch_plan 引用
  review_score_ref: string | null # review_score 引用
  memory_delta_refs:
    - string                      # memory_delta 引用列表
  budget:                         # 预算与限制
    max_plugin_calls: integer     # 最大插件调用次数，MVP-A 为 0
    max_iterations: integer       # 最大迭代次数
    max_memory_reads: integer     # 最大记忆检索次数
    max_outputs: integer          # 最大输出数量
  visibility:                     # 可见性分层
    public_fields:
      - string                    # 可公开字段
    audit_fields:
      - string                    # 审计字段
    private_fields:
      - string                    # 私有字段，不进入长期记忆
