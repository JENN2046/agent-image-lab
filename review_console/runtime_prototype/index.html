<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Image Lab 图像评审台运行原型</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="panel">
        <header>
          <p class="eyebrow">运行原型</p>
          <h1>图像评审台</h1>
        </header>
        <dl class="meta">
          <div><dt>任务</dt><dd id="taskId">-</dd></div>
          <div><dt>案例</dt><dd id="caseId">-</dd></div>
          <div><dt>资产引用</dt><dd id="assetRef">-</dd></div>
        </dl>
        <div class="version-grid">
          <label class="field">
            <span>当前版本</span>
            <select id="versionPicker">
              <option value="v2">v1.1 修订候选图</option>
              <option value="v1">v1.0 参考候选图</option>
            </select>
          </label>
          <label class="field">
            <span>对比版本</span>
            <select id="comparePicker">
              <option value="v1">v1.0 参考候选图</option>
              <option value="">不对比</option>
              <option value="v2">v1.1 修订候选图</option>
            </select>
          </label>
        </div>
        <div class="asset-box" id="assetBox"></div>
        <p class="comparison-summary" id="comparisonSummary"></p>
      </section>

      <section class="panel">
        <h2>人工评审</h2>
        <label class="field">
          <span>人工评分</span>
          <input id="humanScore" type="range" min="0" max="100" value="84" />
          <output id="humanScoreOut">84</output>
        </label>
        <label class="field">
          <span>中文评论</span>
          <textarea id="humanComment" rows="5">人工评审确认该版本可作为候选，但仍需保留已知视觉偏差说明。</textarea>
        </label>
        <label class="field">
          <span>标注备注</span>
          <textarea id="annotationNote" rows="3">对比参考版本后，当前版本的主体构图更稳定，仍需留意细节噪点。</textarea>
        </label>
        <label class="field">
          <span>资产状态</span>
          <select id="assetStatus">
            <option value="candidate">候选</option>
            <option value="rejected">拒收</option>
            <option value="draft">草稿</option>
          </select>
        </label>
        <label class="check">
          <input id="humanApproved" type="checkbox" />
          <span>我确认这张图可接受</span>
        </label>
      </section>

      <section class="panel">
        <h2>记忆预览</h2>
        <label class="field">
          <span>中文记忆正文</span>
          <textarea id="memoryContent" rows="6">本次评审保留 Photo Studio OS 真实闭环经验：资产可作为项目推进候选，但必须记录人工覆盖接受和已知视觉偏差。</textarea>
        </label>
        <label class="field">
          <span>记忆审批</span>
          <select id="memoryApproval">
            <option value="pending">待审批</option>
            <option value="approved">批准写入申请</option>
            <option value="rejected">拒绝写入申请</option>
          </select>
        </label>
      </section>

      <section class="panel">
        <h2>主程序回执</h2>
        <dl class="meta">
          <div><dt>状态</dt><dd id="hostStatus">等待中</dd></div>
          <div><dt>最近提交</dt><dd id="hostSubmittedAt">-</dd></div>
        </dl>
      </section>

      <section class="panel summary-panel">
        <h2>中文摘要</h2>
        <dl class="meta">
          <div><dt>评审状态</dt><dd id="summarySessionStatus">-</dd></div>
          <div><dt>资产结论</dt><dd id="summaryAssetStatus">-</dd></div>
          <div><dt>记忆状态</dt><dd id="summaryMemoryStatus">-</dd></div>
          <div><dt>写入申请</dt><dd id="summaryWriteRequest">-</dd></div>
          <div><dt>安全边界</dt><dd id="summaryGuard">-</dd></div>
        </dl>
      </section>

      <section class="panel output-panel">
        <h2>技术草案</h2>
        <pre id="draftOutput"></pre>
      </section>
    </main>
    <script src="./runtime_guard.js"></script>
    <script src="./host_bridge_mock.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
