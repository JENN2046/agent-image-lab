  memory_delta_draft:
    delta_id: md-phase13-dry-run-dispatch-readiness-001
    task_id: task-phase13-dry-run-dispatch-readiness-001
    case_id: case-phase13-dry-run-dispatch-readiness-001
    agent_name: Archivist_Agent
    target_notebook: Rejected_Visual_Lessons
    write_mode: draft
    approval_required: true
    approval_status: pending
    approved_by: null
    approved_at: null
    chinese_diary_title: "Phase 13 dry-run dispatch readiness 草案"
    chinese_diary_content: |
      本记录说明 Phase 13 只基于占位能力状态生成 dry-run dispatch readiness 草案。当前未读取真实 manifest，未选择真实插件，未调用插件、API、DailyNote 或文件写入。Gatekeeper 和 Review Console handoff 只能用于展示和人工复查，不能触发真实执行。
    tags:
      - Phase13
      - dry-run
      - dispatch
      - no-execution
    memory_safety:
      contains_secret: false
      contains_private_path: false
      contains_customer_private_data: false
      contains_image_binary: false
      safety_notes_cn: "本草案为中文脱敏摘要，不含密钥、私密路径、客户隐私或图片二进制。"
    final_decision:
      should_write_to_vcp: false
      should_show_in_review_console: true
      rejection_reason_cn: null

  no_execution_guard:
    selected_plugin: null
    max_plugin_calls: 0
    source_authorized: false
    source_read_performed: false
    real_manifest_read: false
    real_execution_allowed: false
    external_api_allowed: false
    execution_blocked: true
    api_called: false
    vcp_plugin_called: false
    plugin_called: false
    daily_note_called: false
    vcp_memory_written: false
    disk_write_performed: false
    image_file_created: false
    image_binary_included: false
    vcp_toolbox_read: false
    vcp_toolbox_modified: false
    vcpchat_read: false
    vcpchat_modified: false

  acceptance_assertions:
    - "dispatch 只消费占位能力状态，不选择真实插件。"
    - "selected_plugin 必须为 null。"
    - "max_plugin_calls 必须为 0。"
    - "execution_blocked 必须为 true。"
    - "external_api_allowed 必须为 false。"
    - "allow_file_write 和 allow_image_binary 必须为 false。"
    - "Gatekeeper handoff 和 Review Console handoff 必须是 display-only。"
    - "pending_manifest_review 不得被解释为可执行插件。"
    - "不得进入 dry_run_checked 或 tested。"
    - "所有记忆正文和审计摘要必须为中文脱敏内容。"
