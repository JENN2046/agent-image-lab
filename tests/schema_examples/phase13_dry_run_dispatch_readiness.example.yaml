    approval_to_execute_allowed: false

  review_console_handoff:
    required: true
    display_only: true
    purpose_cn: "展示 dry-run dispatch readiness 草案、被阻止动作和人工复查入口。"
    allowed_actions:
      - mark_candidate
      - reject_candidate
      - request_manifest_authorization
      - request_gatekeeper_review
      - request_memory_edit
    forbidden_actions:
      - execute_plugin
      - call_api
      - write_daily_note
      - save_image
      - mark_dry_run_checked
      - mark_tested
