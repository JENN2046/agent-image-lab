v0_3_manifest_read_authorization_gate:
  authorization_request:
    authorization_request_id: v0-3-manifest-read-auth-gate-001
    requested_phase: "v0.3.0-manifest-read-authorization-gate"
    candidate_id: candidate-plugin-placeholder-001
    purpose_cn: "为未来单一候选 manifest 读取建立授权门槛；本记录不读取真实 manifest。"
    target_repository_ref: repository-ref-placeholder-not-read
    target_manifest_ref: manifest-ref-placeholder-not-read
    read_method_cn: "未来如获独立授权，只能采用受控只读方式；当前记录不执行读取。"
    reader_role: human_reader_placeholder
    reviewer_role: human_reviewer_placeholder
    read_authorized: false
    read_performed: false
    source_authorized: false
    source_read_performed: false
    real_manifest_read: false
    authorization_status: pending
    next_allowed_state: pending_manifest_review
    audit_summary_cn: "仅创建真实 manifest 读取授权门槛草案，未读取真实 VCPToolBox、VCPChat 或 manifest。"

  target_scope:
    unique_candidate_required: true
    candidate_id: candidate-plugin-placeholder-001
    target_repository_ref: repository-ref-placeholder-not-read
    target_manifest_ref: manifest-ref-placeholder-not-read
    target_scope_cn: "未来授权必须限定到一个候选 manifest，不得扩展为仓库级读取。"
    source_authorized: false
    source_read_performed: false
    real_manifest_read: false
    forbidden_scope_cn:
      - "不得读取真实 VCPChat。"
      - "不得读取候选 manifest 之外的仓库内容。"
      - "不得读取客户目录、私密路径或运行态数据目录。"
      - "不得读取图片二进制、插件输出或运行日志。"

  read_method_gate:
    read_method_required: true
    read_method_cn: "只允许未来独立授权后的只读查看方式，不允许执行命令或触发插件运行。"
    executable_command_allowed: false
    repository_wide_scan_allowed: false
    raw_manifest_copy_allowed: false
    sanitized_summary_only: true
    rejection_if_method_unclear_cn: "读取方式不清晰或可能触发执行时，必须拒绝读取申请。"

  extract_policy:
    allowed_extract_fields:
      - "脱敏插件显示名摘要"
      - "命令集合中文摘要"
      - "输入输出模式中文摘要"
      - "权限风险中文摘要"
      - "Gatekeeper 需要复查的风险点"
    allowed_extract_values_present: false
    forbidden_extract_fields:
      - "API key、token、cookie、密码"
      - "私密路径"
      - "客户隐私或客户未公开信息"
      - "webhook、数据库地址或服务端点原文"
      - "manifest 敏感配置原文"
      - "图片二进制"
      - "真实插件输出"
      - "真实运行日志"
    raw_manifest_copy_allowed: false
    sanitized_chinese_summary_required: true

  forbidden_content_policy:
    reject_if_contains_secret: true
    reject_if_contains_private_path: true
    reject_if_contains_customer_private_data: true
    reject_if_requires_raw_manifest_copy: true
    reject_if_requires_plugin_execution: true
    reject_if_requires_api_call: true
    reject_if_requires_daily_note_write: true
    safe_rejection_reason_cn: "如候选 manifest 需要保存敏感原文或触发外部动作，必须拒绝，并只保留中文脱敏拒绝原因。"

  approval_chain:
    human_reviewer_required: true
    gatekeeper_required: true
    review_console_required: true
    archivist_required_for_memory: true
    imagelab_master_required: true
    approval_status: pending
    approved_by: null
    approved_at: null
    approval_notes_cn: "当前尚未授权读取真实 manifest；后续读取必须另开独立授权点。"

  state_transition_rules:
    current_state: pending_manifest_review
    next_allowed_state: pending_manifest_review
    forbidden_states_without_future_read:
      - manifest_reviewed_safe
      - dry_run_checked
      - tested
    rejection_state: rejected
    rule_summary_cn: "本授权门槛草案不能推进状态；只有未来独立授权读取并完成脱敏审查后，才可考虑进入 manifest_reviewed_safe。"

  no_execution_guard:
    read_authorized: false
    read_performed: false
    source_authorized: false
    source_read_performed: false
    real_manifest_read: false
    raw_manifest_copy_allowed: false
    selected_plugin: null
    max_plugin_calls: 0
    api_called: false
    vcp_plugin_called: false
    plugin_called: false
    daily_note_called: false
    vcp_memory_written: false
    disk_write_performed: false
    image_file_created: false
    real_execution_allowed: false
    contains_raw_manifest: false
    contains_real_plugin_name: false
    contains_real_capability_claim: false
    audit_summary_cn: "本门槛草案未读取真实 manifest，未调用插件、API、DailyNote，未写文件或创建图片。"

  audit_record:
    audit_id: audit-v0-3-manifest-read-auth-gate-001
    authorization_request_id: v0-3-manifest-read-auth-gate-001
    candidate_id: candidate-plugin-placeholder-001
    audit_status: draft
    source_authorized: false
    source_read_performed: false
    real_manifest_read: false
    real_execution_allowed: false
    audit_summary_cn: "本审计只确认真实 manifest 读取前的授权门槛字段，未读取真实源，也未产生真实插件能力结论。"

  memory_delta_draft:
    delta_id: md-v0-3-manifest-read-auth-gate-001
    task_id: task-v0-3-manifest-read-auth-gate-001
    case_id: case-v0-3-manifest-read-auth-gate-001
    agent_name: Archivist_Agent
    target_notebook: Rejected_Visual_Lessons
    write_mode: draft
    approval_required: true
    approval_status: pending
    approved_by: null
    approved_at: null
    chinese_diary_title: "v0.3 manifest 读取授权门槛草案"
    chinese_diary_content: |
      本记录说明 v0.3.0 只补齐真实 manifest 读取前的授权门槛。当前未读取真实 VCPToolBox、VCPChat 或 manifest，未选择真实插件，未调用插件、API、DailyNote，未写文件或创建图片。后续如需读取真实 manifest，必须另开独立授权点，并先确认唯一候选、读取方式、可摘录字段、禁止字段和审查链。
    tags:
      - v0.3
      - manifest读取授权
      - no-read
      - no-execution
    memory_safety:
      contains_secret: false
      contains_private_path: false
      contains_customer_private_data: false
      contains_image_binary: false
      safety_notes_cn: "本草案为中文脱敏摘要，不含密钥、私密路径、客户隐私或图片二进制。"
    final_decision:
      should_write_to_vcp: false
      should_show_in_review_console: true
      rejection_reason_cn: null

  acceptance_assertions:
    - "read_authorized 必须为 false。"
    - "read_performed 必须为 false。"
    - "source_authorized 必须为 false。"
    - "source_read_performed 必须为 false。"
    - "real_manifest_read 必须为 false。"
    - "raw_manifest_copy_allowed 必须为 false。"
    - "real_execution_allowed 必须为 false。"
    - "selected_plugin 必须为 null。"
    - "max_plugin_calls 必须为 0。"
    - "api_called、vcp_plugin_called、daily_note_called 必须为 false。"
    - "当前状态必须保持 pending_manifest_review。"
    - "不得进入 manifest_reviewed_safe、dry_run_checked 或 tested。"
    - "不得记录真实插件名、真实 manifest 原文、真实插件路径或真实能力结论。"
    - "所有记忆正文、拒绝原因和审计摘要必须为中文脱敏内容。"
