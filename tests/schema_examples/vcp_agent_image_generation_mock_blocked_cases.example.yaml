# VCP Agent image-generation mock blocked cases.
# Each case should fail local mock validation without any side effects.

vcp_agent_image_generation_mock_blocked_cases_v1:
  phase: v0_6_64_vcp_agent_image_generation_contract_mock_validation
  source_phase: v0_6_63_vcp_agent_image_generation_tool_contract_v1
  execution_mode: local_mock_validation_only
  expected_case_count: 15

  cases:
    - case_id: missing_prompt_package_ref
      mutation: remove prompt_package_ref
      expected_block: true

    - case_id: arbitrary_plugin_id
      selected_route: arbitrary_plugin_id
      expected_block: true

    - case_id: max_plugin_calls_gt_1
      max_plugin_calls: 2
      expected_block: true

    - case_id: max_images_created_gt_1
      max_images_created: 2
      expected_block: true

    - case_id: retry_limit_gt_0
      retry_limit: 1
      expected_block: true

    - case_id: memory_write_allowed_true
      memory_write_allowed: true
      expected_block: true

    - case_id: accepted_samples_write_allowed_true
      accepted_samples_write_allowed: true
      expected_block: true

    - case_id: production_candidate_write_allowed_true
      production_candidate_write_allowed: true
      expected_block: true

    - case_id: raw_prompt_payload_present
      raw_prompt_payload: forbidden
      expected_block: true

    - case_id: secret_value_present
      secret_value: forbidden
      expected_block: true

    - case_id: raw_provider_response_present
      raw_provider_response: forbidden
      expected_block: true

    - case_id: private_absolute_path_present
      private_absolute_path: C:/Users/private/generated.png
      expected_block: true

    - case_id: output_directory_outside_runs_real_generation
      output_directory_ref: temp/generated/
      expected_block: true

    - case_id: mock_response_claims_image_generation
      response_mutation: image_generation_performed true
      expected_block: true

    - case_id: mock_response_claims_output_write
      response_mutation: output_write_performed true
      expected_block: true
