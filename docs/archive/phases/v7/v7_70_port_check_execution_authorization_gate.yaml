v7_70_port_check_execution_authorization_gate:
  schema_version: v1
  gate_type: execution_authorization_gate
  status: prepared_not_granted
  phase: v7_70
  scope: port_check_execution
  runtime_execution: false
  port_check_executed: false

  carry_forward:
    prior_v7_69_commit: bc46ec7
    primary_check_port: 9222
    fallback_check_port: 9223

  exact_commands:
    primary:
      id: port_check_9222
      port: 9222
      robust_spec:
        - "no connection:         'port_9222_status: free'"
        - "owning process=electron: 'port_9222_status: occupied_by_vcpchat'"
        - "owning process=other:    'port_9222_status: occupied_by_other'"
        - "Get-Process error:       'port_9222_status: check_error'"
      command: "$c=Get-NetTCPConnection -LocalPort 9222 -ErrorAction 0;if(!$c){'port_9222_status: free';exit};$p=Get-Process -Id $c.OwningProcess -ErrorAction 0;if(!$p){'port_9222_status: check_error';exit};if($p.ProcessName-eq'electron'){'port_9222_status: occupied_by_vcpchat'}else{'port_9222_status: occupied_by_other'}"
      platform: Windows
      max_calls: 1
      classification: read_only
    fallback:
      id: port_check_9223
      port: 9223
      robust_spec:
        - "no connection:         'port_9223_status: free'"
        - "owning process=electron: 'port_9223_status: occupied_by_vcpchat'"
        - "owning process=other:    'port_9223_status: occupied_by_other'"
        - "Get-Process error:       'port_9223_status: check_error'"
      command: "$c=Get-NetTCPConnection -LocalPort 9223 -ErrorAction 0;if(!$c){'port_9223_status: free';exit};$p=Get-Process -Id $c.OwningProcess -ErrorAction 0;if(!$p){'port_9223_status: check_error';exit};if($p.ProcessName-eq'electron'){'port_9223_status: occupied_by_vcpchat'}else{'port_9223_status: occupied_by_other'}"
      platform: Windows
      max_calls: 1
      classification: read_only
      run_condition: only if 9222 occupied by non-VCPChat process
    total_max_calls: 2
    max_calls_if_9222_free: 1
    max_calls_if_9222_occupied: 2

  authorization:
    authorized_by_this_document: false
    user_explicit_authorization_required: true
    authorization_phrase: "批准 v7.70 端口检测"

  permanently_forbidden:
